<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Client Ledger</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header with tabs (Dashboard, Projects, Clients, Money); each tab is one page; a project or client opens its own page; a bottom sheet adds and edits things. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --fg:#141821; --muted:#5d6577; --line:#e1e5ec;
  --accent:#2b4fd8; --accent-ink:#ffffff; --in:#17855a; --out:#c23d2a; --in-soft:#e3f4ec; --out-soft:#fbe9e6;
  --c-in:#2a78d6; --c-out:#eb6834; /* chart series: money in / money out (colour-blind safe pair) */
  --shadow:0 1px 2px rgba(20,24,33,.06),0 8px 24px rgba(20,24,33,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#181c25; --fg:#eef0f5; --muted:#9aa2b4; --line:#2a303d;
  --accent:#7d95ff; --accent-ink:#0f1218; --in:#4fd197; --out:#ff8a76; --in-soft:#173329; --out-soft:#3a1f1b;
  --c-in:#3987e5; --c-out:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#181c25; --fg:#eef0f5; --muted:#9aa2b4; --line:#2a303d;
  --accent:#7d95ff; --accent-ink:#0f1218; --in:#4fd197; --out:#ff8a76; --in-soft:#173329; --out-soft:#3a1f1b;
  --c-in:#3987e5; --c-out:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden}
.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px 20px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
@media (max-width:640px){.top{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;grid-row:2}}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:28px;letter-spacing:-.01em}
.card{background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:17px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,30px);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-head h2{font-size:18px;font-weight:600}
.list{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card .list{box-shadow:none;border:1px solid var(--line);border-radius:12px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:none}
button.row,a.row{width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
button.row:last-child,a.row:last-child{border-bottom:none}
button.row:hover,a.row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.avatar{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent)}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.in{background:var(--in)} .dot.out{background:var(--out)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--out);border-color:var(--out);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--out)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:focus-visible,button.row:focus-visible,a.row:focus-visible,.tabs a:focus-visible,.chart:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.card .empty{background:none}
.back{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px 0;align-self:flex-start;text-decoration:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--out);font-size:14px}
.notice{background:var(--panel);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.notice .linkbtn{font-size:14px;font-weight:600}
.login{width:100%;max-width:380px;margin:10vh auto 0;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0;align-self:flex-start}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:11px;box-shadow:var(--shadow);flex-wrap:wrap}
.pills button{font:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;padding:6px 10px;background:none;color:var(--muted);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pills button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{max-width:260px}
/* status badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--fg);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.badge.active::before{background:var(--accent)}
.badge.lead::before{background:transparent;border:1.5px solid var(--muted)}
.badge.done::before{background:var(--in)}
.badge.paused::before{background:var(--muted);border-radius:1px}
/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;color:inherit;text-decoration:none}
.pcard:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.pcard h3{font-size:17px;font-weight:600;font-family:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .desc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;margin:0}
.ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.links{display:flex;gap:6px;flex-wrap:wrap}
.link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.link:hover{text-decoration:underline}
.link.none{color:var(--muted);background:var(--bg);font-weight:500}
.link svg{width:14px;height:14px;flex:none}
.progress{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--in);border-radius:999px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.mini div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mini .l{color:var(--muted);font-size:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;font-size:14px}
.facts .l{display:block;font-size:12px;color:var(--muted)}
.prose{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
/* charts */
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;border-radius:8px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .b-in{fill:var(--c-in)} .chart .b-out{fill:var(--c-out)}
.chart .hl{fill:var(--fg);opacity:0}
.chart .hl.on{opacity:.06}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:nowrap;box-shadow:var(--shadow);z-index:3}
.tip b{display:block;font-weight:600}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--c-out);border-radius:0 4px 4px 0}
details.tbl summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px!important}}
.sheet{background:var(--panel);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:90px}
.amount{font-family:var(--mono);font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{font:inherit;font-weight:600;border:none;border-radius:9px;padding:10px;background:none;color:var(--muted);cursor:pointer}
.first-run-page{margin:6vh auto 0}
.empty-actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.first-run h1{font-size:26px}
.seg button[aria-pressed="true"].in{background:var(--in);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--out);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.state{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.state.paid{color:var(--in)} .state.overdue{background:var(--out);color:#fff}
.overdue-note{font-size:13px;font-weight:600;color:var(--out)}
.splits{display:flex;gap:6px;flex-wrap:wrap}
.msrows{display:flex;flex-direction:column;gap:10px}
.msrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9em);gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.msrow .msfoot{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.msrow .msfoot input{flex:1;min-width:0}
.msrow.rest{border-style:dashed}
.msrow.rest input[readonly]{background:var(--panel);color:var(--muted)}
.msrow.none{opacity:.6}
.msrow .auto-note{grid-column:1/-1}
.total{font-size:14px;font-weight:600} .total.warn{color:var(--out)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.newbox{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot .ghost{margin-right:auto}
@media (max-width:480px){.two,.three{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.state.cancelled{text-decoration:line-through}
.pre{white-space:pre-line}
.items{display:flex;flex-direction:column;gap:8px}
.itemrow{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.itemnums{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:6px;align-items:center}
.invoice{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:22px;max-width:820px;width:100%;box-sizing:border-box}
.inv-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.inv-biz{font-size:20px;font-weight:700}
.inv-word{font-size:26px;font-weight:700;letter-spacing:.02em}
.inv-title{text-align:right}
.inv-muted{color:var(--muted);font-size:14px}
.inv-meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;font-size:14px}
.inv-meta .l,.inv-pay .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
.inv-items{font-size:14px;margin:0}
.inv-items th:first-child,.inv-items td:first-child{text-align:left}
.inv-items td{padding:9px 8px;overflow-wrap:anywhere}
.inv-items tfoot td{border:none;font-weight:600}
.inv-items tfoot .due td{font-size:17px}
.inv-pay{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;font-size:14px}
.inv-pay>div{display:flex;flex-direction:column;gap:4px}
.qr svg{display:block;border-radius:8px}
.inv-notes{font-size:14px;color:var(--muted)}
.stamp{display:inline-block;margin-top:6px;border:2px solid currentColor;border-radius:6px;padding:2px 10px;font-weight:700;text-transform:uppercase;font-size:13px}
.stamp.paid{color:var(--in)} .stamp.cancelled{color:var(--out)}
@media (max-width:560px){.inv-meta{grid-template-columns:1fr 1fr}.inv-meta>div:first-child{grid-column:1/-1}.invoice{padding:18px}.inv-title{text-align:left}}
/* Boards: columns side by side, scrolling sideways inside the board (never the page) on small screens. */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
@media (max-width:640px){.board{grid-auto-columns:84%}}
.bcol{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0;scroll-snap-align:start}
.bcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px}
.bhead h2{font-size:15px}
.bcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:grab}
.bcard.dragging{opacity:.45}
.bcard .title{font-weight:600;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .title:hover{color:var(--accent)}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.bcard select{font-size:12px;padding:4px 8px;width:auto;border-radius:8px}
.bcard .state:not(.overdue){background:var(--panel)}
.bempty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.view-pills button{padding:6px 12px}
.svcrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.svcrow:last-child{border-bottom:none}
.sub.out{color:var(--out)}
.svcrow .grow{background:none;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.svcrow .right{flex-shrink:0}
.renew-steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.renew-steps label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.renew-steps input{width:auto;margin-top:3px}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(92vw,520px);background:var(--out);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.task-check{width:20px;height:20px;flex:none;padding:0;accent-color:var(--accent)}
.task-done{text-decoration:line-through;color:var(--muted)}
.head-actions{display:flex;gap:10px;align-items:center}
.btn[aria-current="page"]{border-color:var(--accent)}
.settings-page{display:flex;flex-direction:column;gap:20px;max-width:720px}
.settings-card{gap:14px}
.save-row{display:flex;gap:12px;align-items:center}
.saved{color:var(--in);font-weight:600;font-size:13px}
.warn-note{color:var(--out)}
.warn-note:empty{display:none}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}
/* Print (Save as PDF): just the invoice, in black on white, on one A4 page. */
@media print{
  @page{size:A4;margin:12mm}
  :root{--panel:#fff;--bg:#fff;--fg:#000;--muted:#555;--line:#ccc}
  body{background:#fff;color:#000;font-size:13px}
  .top,.no-print,.back,#sheet-root{display:none!important}
  .app{padding:0;max-width:none;gap:0}

}

<div class="app" id="app">
  <div class="top">
    <div class="brand">Client Ledger</div>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden>

    </nav>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script>
(function(){
const S = { clients:[], projects:[], txns:[], milestones:[], invoices:[], settings:[], services:[], tasks:[], time_entries:[], raw:{}, iFilter:'open', view:{name:'home'}, ready:false, error:'', session:null, authReady:false,
  period:pref('period','this_fy'), pView:pref('projectView','list'), iView:pref('invoiceView','list'), pStatus:'open', pQuery:'', mType:'all', mQuery:'' };
let db = null;
const $ = (s,el=document)=>el.querySelector(s);
function pref(k,d){ try{ return localStorage.getItem('ledger.'+k) || d; }catch(e){ return d; } }
function setPref(k,v){ try{ localStorage.setItem('ledger.'+k,v); }catch(e){} }
// Currencies: one fixed list, the same as CURRENCIES in api/_lib/ledger.js and the checks in supabase/schema.sql (tests/consistency.test.js compares them).
const CURRENCIES = ['INR','USD','EUR','GBP','AUD','CAD','SGD','AED','NZD','CHF','JPY','ZAR'];
const LOCALES = [['en-IN','India (1,00,000)'],['en-US','United States'],['en-GB','United Kingdom'],['en-AU','Australia'],['en-CA','Canada']];
const curOf = c => CURRENCIES.includes(c) ? c : 'INR'; // rows from before currencies existed are rupees
const validTz = tz => { try{ new Intl.DateTimeFormat('en-CA',{timeZone:tz||'Asia/Kolkata'}); return tz||'Asia/Kolkata'; }catch(e){ return 'Asia/Kolkata'; } };
// Amounts are written in their own currency and the user's locale. rs: whole units (lists, dashboards); ex: exact (forms, invoices, messages).
// Amounts in different currencies are never added together: totals are worked out per currency.
const fmtNum = (n,cur,digits) => { try{ return new Intl.NumberFormat(biz().locale,{style:'currency',currency:cur,minimumFractionDigits:digits,maximumFractionDigits:digits}).format(n); }catch(e){ return cur+' '+n; } };
const rs = (n,cur) => fmtNum(Math.round(Number(n)||0), curOf(cur||biz().defaultCurrency), 0);
const ex = (n,cur) => { cur=curOf(cur||biz().defaultCurrency); const x=Math.round((Number(n)||0)*100)/100; return fmtNum(cur==='JPY'?Math.round(x):x, cur, cur==='JPY'||Number.isInteger(x)?0:2); };
const signed = (n,cur) => (n<0?'−':'') + rs(Math.abs(n),cur);
const compact = (n,cur) => { cur=curOf(cur||biz().defaultCurrency);
  if(cur==='INR' && biz().locale==='en-IN'){ const a=Math.abs(n); const f=(x,s)=>(Math.round(x*10)/10).toString().replace(/\.0$/,'')+s; return '₹'+(a>=1e7?f(n/1e7,'Cr'):a>=1e5?f(n/1e5,'L'):a>=1e3?f(n/1e3,'k'):Math.round(n)); } // lakh and crore, as people write rupees in India
  try{ return new Intl.NumberFormat(biz().locale,{style:'currency',currency:cur,notation:'compact',maximumFractionDigits:1}).format(n); }catch(e){ return cur+' '+Math.round(n); } };
// The symbol alone (₹, $, €), for labels like "Amount (₹)".
const curSym = c => { try{ return new Intl.NumberFormat(biz().locale,{style:'currency',currency:curOf(c)}).formatToParts(0).find(x=>x.type==='currency').value; }catch(e){ return c; } };
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
// "Today" is the date where the user is (their time zone setting), not where the browser happens to be.
const todayIn = tz => { try{ return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ return ymd(new Date()); } };
const today = () => todayIn(biz().timezone);
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
const nowD = () => parseD(today());
const fmtDate = d => d ? parseD(d).toLocaleDateString(biz().locale,{day:'numeric',month:'short',year:'numeric'}) : 'Earlier';
// Money totals per currency, the default currency first: [{cur, earned, spent, profit}]. `extra` adds currencies that should show even with no money.
function curOrder(list){ const d=biz().defaultCurrency; return [...new Set(list)].sort((a,b)=>a===d?-1:b===d?1:a.localeCompare(b)); }
function sumsByCur(txns, extra=[]){
  const curs=curOrder([...txns.map(t=>t.currency),...extra]); if(!curs.length) curs.push(biz().defaultCurrency);
  return curs.map(c=>({cur:c, ...sumOf(txns.filter(t=>t.currency===c))}));
}
const usedCurrencies = () => curOrder([...S.projects,...S.txns,...S.invoices,...S.services].map(x=>x.currency));
// The currency the dashboard and renewals page are showing: the one picked last, else the default.
function dashCur(){ const used=usedCurrencies(), want=pref('currency',''), d=biz().defaultCurrency; return used.includes(want) ? want : (!used.length||used.includes(d)) ? d : used[0]; }
// Pills to switch currency; only there when the user has money in more than one.
function curPills(cur){ const used=usedCurrencies(); if(used.length<2) return null;
  return h('div',{class:'pills cur-pills',role:'group','aria-label':'Currency'},used.map(c=>h('button',{type:'button','aria-pressed':String(c===cur),onclick:()=>{ setPref('currency',c); render(); }},c))); }
const currencySelect = (id,value) => { const el=h('select',{id},CURRENCIES.map(c=>h('option',{value:c},c))); el.value=curOf(value); return el; };
function h(tag, attrs, ...kids){ const el=document.createElement(tag); if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue; if(k==='class') el.className=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?'':v);} kids.flat().forEach(c=>{ if(c==null||c===false) return; el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c); }); return el; }
function svg(tag, attrs, ...kids){ const el=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs||{}) if(attrs[k]!=null) el.setAttribute(k,attrs[k]); kids.flat().forEach(c=>{ if(c!=null) el.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return el; }
const canWrite = () => !!db;
const add = (el,...kids) => el.append(...kids.filter(k=>k!=null)); // like append, but skips the nulls optional sections return

// Links are typed by hand, so only http(s) addresses are ever stored or rendered.
function cleanUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u='https://'+u; try{ const x=new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; } }
const shortUrl = u => u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');

const STATUSES = [['lead','Lead'],['active','In progress'],['paused','On hold'],['done','Done']];
const statusLabel = s => (STATUSES.find(x=>x[0]===s)||STATUSES[1])[1];
const badge = s => h('span',{class:'badge '+s},statusLabel(s));
const CATEGORIES = ['Domain','Hosting','Software & plugins','Design assets','Contractor','Ads & marketing','Travel','Other'];
// Expenses logged before categories existed only have a note, like "Domain"; use it when it names a category.
const guessCategory = note => CATEGORIES.find(c=>c.toLowerCase()===String(note||'').trim().toLowerCase()) || '';

function sumOf(txns){ let i=0,o=0; txns.forEach(t=>{ if(t.type==='out') o+=Number(t.amount)||0; else i+=Number(t.amount)||0; }); return {earned:i, spent:o, profit:i-o}; }
const clientOf = id => S.clients.find(c=>c.id===id);
const clientName = id => (clientOf(id)||{}).name || 'Unknown client';
const projOf = id => S.projects.find(p=>p.id===id);
const projName = id => (projOf(id)||{}).name || 'No project';
const sortTx = arr => arr.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
const sortClients = arr => arr.slice().sort((a,b)=>(a.order??1e9)-(b.order??1e9) || (a.createdAt||0)-(b.createdAt||0));
const STATUS_ORDER = {active:0,lead:1,paused:2,done:3};
const sortProjects = arr => arr.slice().sort((a,b)=>(STATUS_ORDER[a.status]??9)-(STATUS_ORDER[b.status]??9) || (b.createdAt||0)-(a.createdAt||0));
// What a project has brought in, cost, is still owed, and is overdue on its milestones. Leads aren't owed anything yet.
function projStats(p){ const s=sumOf(S.txns.filter(t=>t.projectId===p.id)); return {...s, cur:p.currency, quoted:p.quoted||0, due: p.status==='lead' ? 0 : Math.max(0,(p.quoted||0)-s.earned),
  overdue: projMilestones(p).reduce((a,m)=>a+(m.state==='overdue'?m.left:0),0)}; }
// The project's money in pays off its milestones in order. One is overdue when its due date has passed and it isn't fully paid. Same rules as ledger.js.
const cents = n => Math.round(n*100)/100;
function projMilestones(p){
  let left=sumOf(S.txns.filter(t=>t.projectId===p.id)).earned; const t=today();
  return S.milestones.filter(m=>m.projectId===p.id).sort((a,b)=>a.order-b.order||a.createdAt-b.createdAt).map(m=>{
    const paid=cents(Math.min(m.amount,left)); left=cents(left-paid); const owing=cents(m.amount-paid);
    const overdue=owing>0 && p.status!=='lead' && !!m.dueDate && m.dueDate<t;
    return {...m, paid, left:owing, state:!owing?'paid':overdue?'overdue':paid?'part-paid':'unpaid'};
  });
}
const MS_STATES = {paid:'Paid','part-paid':'Part paid',overdue:'Overdue',unpaid:'Not paid yet'};
const msName = (i,n) => n===1 ? 'Full payment' : i===0 ? 'Advance' : i===n-1 ? 'Final payment' : 'Payment '+(i+1);

// ---------- routing ----------
function parseHash(){ const parts=location.hash.replace(/^#\/?/,'').split('/'); const n=parts[0]||'home';
  if((n==='project'||n==='client'||n==='invoice') && parts[1]) return {name:n,id:decodeURIComponent(parts[1])};
  return {name:['projects','clients','money','invoices','renewals','settings'].includes(n)?n:'home'}; }
const hrefOf = v => v.name==='home' ? '#/' : '#/'+v.name+(v.id?'/'+encodeURIComponent(v.id):'');
function go(v){ const href=hrefOf(v); S.view=v; if(location.hash===href) render(); else location.hash=href; } // S.view is set first: the hashchange that follows is async, and a redraw before it must already know where we're going
window.addEventListener('hashchange',()=>{ S.view=parseHash(); S.settingsSaved=null; closeSheet(); render(); window.scrollTo(0,0); });

function render(){
  const v = $('#view'); v.textContent='';
  const signedIn = !!(S.session && S.session.user);
  $('#signout').hidden = !signedIn;
  const setup = signedIn && S.ready && needsFirstRun();
  $('#tabs').hidden = !signedIn || !S.ready || setup;
  $('#settings-link').hidden = !signedIn || !S.ready || setup;
  if(S.view.name==='settings') $('#settings-link').setAttribute('aria-current','page'); else $('#settings-link').removeAttribute('aria-current');
  const tab = {project:'projects',client:'clients',invoice:'invoices'}[S.view.name] || S.view.name;
  document.querySelectorAll('#tabs a').forEach(a=>{ if(a.getAttribute('href')===hrefOf({name:tab})) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  // On a phone the tabs scroll sideways; keep the current one in view.
  const bar=$('#tabs'), cur=bar.querySelector('[aria-current]');
  if(cur && !bar.hidden){ const over=cur.getBoundingClientRect().right-bar.getBoundingClientRect().right; if(over>0) bar.scrollLeft+=over+8; else if(cur.offsetLeft<bar.scrollLeft) bar.scrollLeft=0; }
  if(!S.authReady){ v.appendChild(h('div',{class:'empty'},'Loading…')); return; }
  if(!S.session){ return renderLogin(v); }
  if(S.error){ v.appendChild(h('div',{class:'empty'},S.error)); return; }
  if(!S.ready){ v.appendChild(h('div',{class:'empty'},'Loading your projects and money…')); return; }
  if(needsFirstRun()) return renderFirstRun(v);
  ({home:renderHome,projects:renderProjects,project:renderProject,clients:renderClients,client:renderClient,money:renderMoney,invoices:renderInvoices,invoice:renderInvoice,renewals:renderRenewals,settings:renderSettings})[S.view.name](v, S.view.id);
}

// ---------- dashboard ----------
// A financial year starts on the 1st of the user's chosen month (April by default). fyStart() is the year the current one began:
// 2026 for FY 2026–27, or for FY 2026 with a January start.
const fyStart = () => { const t=today(); return Number(t.slice(0,4)) - (Number(t.slice(5,7))<biz().fyStartMonth ? 1 : 0); };
const fyLabel = y => biz().fyStartMonth===1 ? 'FY '+y : 'FY '+y+'–'+String(y+1).slice(2);
const fyRange = y => { const sm=biz().fyStartMonth; return [y+'-'+pad(sm)+'-01', sm===1 ? y+'-12-31' : ymd(new Date(y+1,sm-1,0))]; };
const PERIODS = [['this_fy'],['last_fy'],['month'],['12m'],['year'],['all']];
const periodInfo = k => ({this_fy:[fyLabel(fyStart()),'This financial year'], last_fy:[fyLabel(fyStart()-1),'Last financial year'], month:['This month'], '12m':['Last 12 months'], year:['This year'], all:['All time']})[k];
// The chart's buckets for a period: days for this month, months otherwise. A transaction falls in a bucket when its date starts with the key.
function periodBuckets(p){
  const now=nowD(), out=[], loc=biz().locale, sm=biz().fyStartMonth;
  if(p==='month'){ for(let d=1; d<=now.getDate(); d++){ const dt=new Date(now.getFullYear(),now.getMonth(),d); out.push({key:ymd(dt),label:String(d),long:dt.toLocaleDateString(loc,{day:'numeric',month:'short'})}); } return out; }
  let start;
  let end=now;
  if(p==='12m') start=new Date(now.getFullYear(),now.getMonth()-11,1);
  else if(p==='year') start=new Date(now.getFullYear(),0,1);
  else if(p==='this_fy') start=new Date(fyStart(),sm-1,1);
  else if(p==='last_fy'){ start=new Date(fyStart()-1,sm-1,1); end=new Date(fyStart(),sm-2,1); }
  else { const first=S.txns.map(t=>t.date).filter(Boolean).sort()[0]; start = first ? parseD(first.slice(0,7)+'-01') : new Date(now.getFullYear(),now.getMonth()-11,1);
    const min=new Date(now.getFullYear(),now.getMonth()-11,1); if(start>min) start=min; }
  for(let d=new Date(start.getFullYear(),start.getMonth(),1); d<=end; d=new Date(d.getFullYear(),d.getMonth()+1,1))
    out.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),label:d.toLocaleDateString(loc,{month:'short'}),long:d.toLocaleDateString(loc,{month:'long',year:'numeric'})});
  return out;
}
function inPeriod(t,p){ if(p==='all') return true; if(!t.date) return false; const now=nowD();
  if(p==='month') return t.date.startsWith(today().slice(0,7));
  if(p==='year') return t.date.startsWith(String(now.getFullYear()));
  if(p==='this_fy'||p==='last_fy'){ const [a,b]=fyRange(fyStart()-(p==='last_fy'?1:0)); return t.date>=a && t.date<=b; }
  return t.date >= ymd(new Date(now.getFullYear(),now.getMonth()-11,1)); }

function renderHome(v){
  // Everything on the dashboard is in one currency (switch it with the pills when there are several): amounts in different currencies are never added.
  const cur=dashCur(), p=S.period, mine=S.txns.filter(t=>t.currency===cur), tx=mine.filter(t=>inPeriod(t,p)), all=sumOf(tx), projs=S.projects.filter(x=>x.currency===cur);
  const margin = all.earned>0 ? Math.round(all.profit/all.earned*100) : null;
  const stats = projs.map(pr=>({p:pr,...projStats(pr)}));
  const owed = stats.reduce((a,s)=>a+s.due,0);
  const pipeline = projs.filter(x=>x.status==='lead').reduce((a,x)=>a+(x.quoted||0),0);
  const nActive = projs.filter(x=>x.status==='active').length;
  const nLeads = projs.filter(x=>x.status==='lead').length;
  const pills = h('div',{class:'pills',role:'group','aria-label':'Time period'},
    PERIODS.map(([k])=>{ const [l,long]=periodInfo(k); return h('button',{type:'button',title:long,'aria-pressed':String(p===k),onclick:()=>{S.period=k;setPref('period',k);render();}},l); }));
  add(v,
    h('div',{class:'page-head'},h('h1',null,'Dashboard'),
      canWrite() ? h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>openMoneySheet()},'+ Add money'),h('button',{class:'btn primary',onclick:()=>openProjectSheet()},'+ New project')) : null),
    h('div',{class:'filters'},pills,curPills(cur)),
    undatedNote(),
    h('div',{class:'kpis'},
      kpi('Revenue', rs(all.earned,cur), 'Money in', 'in'),
      kpi('Spending', rs(all.spent,cur), 'Money out', 'out'),
      kpi('Profit', signed(all.profit,cur), margin==null ? 'No revenue yet' : margin+'% margin', all.profit<0?'out':''),
      kpi('Still to collect', rs(owed,cur), 'Quoted, not yet paid · all time'),
      kpi('Projects', String(nActive), 'in progress · '+nLeads+(nLeads===1?' lead':' leads')+(pipeline?' worth '+compact(pipeline,cur):''))));
  if(!S.projects.length && !S.txns.length){
    v.appendChild(h('div',{class:'empty'},'Nothing here yet. Add your first project — with its client, links and price — then log payments and expenses against it.',
      sampleOn() && !S.clients.length ? h('div',{class:'empty-actions'},h('span',{class:'muted'},'Or look around first: '),h('button',{class:'btn',type:'button',id:'load-sample',onclick:loadSample},'Load sample data')) : null));
    return;
  }
  if(sampleOn() && hasSample()) v.insertBefore(h('div',{class:'notice',id:'sample-note'},'You’re looking at sample data. ',h('button',{class:'linkbtn',type:'button',onclick:confirmRemoveSample},'Remove sample data')), v.querySelector('.kpis'));
  // chart + side lists
  const buckets = periodBuckets(p);
  buckets.forEach(b=>{ const s=sumOf(mine.filter(t=>(t.date||'').startsWith(b.key))); b.in=s.earned; b.out=s.spent; });
  const chartBox = h('div',{class:'chart',tabindex:'0','aria-label':'Money in and out '+(p==='month'?'by day':'by month')+'. Use the arrow keys to read each '+(p==='month'?'day':'month')+'.'});
  const table = h('details',{class:'tbl'},h('summary',null,'Show as table'),h('div',{class:'tblwrap'},h('table',null,
    h('thead',null,h('tr',null,h('th',null,p==='month'?'Day':'Month'),h('th',null,'Money in'),h('th',null,'Money out'),h('th',null,'Profit'))),
    h('tbody',null,buckets.slice().reverse().map(b=>h('tr',null,h('td',null,b.long),h('td',{class:'num'},rs(b.in,cur)),h('td',{class:'num'},rs(b.out,cur)),h('td',{class:'num'},signed(b.in-b.out,cur))))))));
  const hasChart = buckets.some(b=>b.in||b.out);
  const chartCard = h('div',{class:'card'},
    h('div',{class:'card-head'},h('h2',null,'Money in and out'),
      h('div',{class:'legend'},h('span',null,h('i',{style:'background:var(--c-in)'}),'Money in'),h('span',null,h('i',{style:'background:var(--c-out)'}),'Money out'))),
    chartBox, hasChart ? table : null,
    S.txns.some(t=>!t.date) && p==='all' && S.txns.some(t=>t.date) ? h('div',{class:'hint'},'Entries with no date aren’t on the chart, but are counted in the totals above.') : null);

  const top = stats.map(s=>({...s, ...sumOf(tx.filter(t=>t.projectId===s.p.id))})).filter(s=>s.earned||s.spent).sort((a,b)=>b.profit-a.profit).slice(0,6);
  const topCard = h('div',{class:'card'},h('div',{class:'card-head'},h('h2',null,'Most profitable projects'),h('span',{class:'sub'},periodLabel(p))));
  if(!top.length) topCard.appendChild(h('div',{class:'empty'},'No project money in this period.'));
  else topCard.appendChild(h('div',{class:'list'},top.map(s=>h('a',{class:'row',href:hrefOf({name:'project',id:s.p.id})},
    h('div',{class:'grow'},h('div',{class:'title'},s.p.name),h('div',{class:'sub'},clientName(s.p.clientId)+' · '+rs(s.earned,cur)+' in · '+rs(s.spent,cur)+' out')),
    h('span',{class:'num'+(s.profit<0?' out':'')},signed(s.profit,cur))))));

  const owedList = stats.filter(s=>s.due>0).sort((a,b)=>b.due-a.due).slice(0,6);
  const owedCard = h('div',{class:'card'},h('div',{class:'card-head'},h('h2',null,'Still to collect'),h('span',{class:'num sub'},rs(owed,cur))));
  if(!owedList.length) owedCard.appendChild(h('div',{class:'empty'},'Nothing owed. Set a quoted price on a project to track what’s left to collect.'));
  else owedCard.appendChild(h('div',{class:'list'},owedList.map(s=>h('a',{class:'row',href:hrefOf({name:'project',id:s.p.id})},
    h('div',{class:'grow'},h('div',{class:'title'},s.p.name),h('div',{class:'sub'},clientName(s.p.clientId)+' · '+rs(s.earned,cur)+' of '+rs(s.quoted,cur)+' paid'),s.overdue?h('div',{class:'overdue-note'},rs(s.overdue,cur)+' overdue'):null),
    h('span',{class:'num'},rs(s.due,cur))))));

  const byCat = {}; tx.filter(t=>t.type==='out').forEach(t=>{ const c=t.category||'Other'; byCat[c]=(byCat[c]||0)+t.amount; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const catMax = cats.length?cats[0][1]:0;
  const spendCard = h('div',{class:'card'},h('div',{class:'card-head'},h('h2',null,'Where the money went'),h('span',{class:'sub'},periodLabel(p))));
  if(!cats.length) spendCard.appendChild(h('div',{class:'empty'},'No spending in this period.'));
  else spendCard.appendChild(h('div',{class:'hbars'},cats.map(([c,n])=>h('div',{class:'hbar'},h('span',null,c),h('span',{class:'num'},rs(n,cur)),
    h('div',{class:'track','aria-hidden':'true'},h('span',{style:'width:'+Math.max(2,n/catMax*100)+'%'}))))));

  const rec = sortTx(mine).slice(0,8);
  const recCard = h('div',{class:'card'},h('div',{class:'card-head'},h('h2',null,'Recent money'),h('a',{class:'back',href:'#/money',style:'font-size:13px'},'See all →')));
  if(!rec.length) recCard.appendChild(h('div',{class:'empty'},'Every payment and expense you log shows up here.'));
  else recCard.appendChild(h('div',{class:'list'},rec.map(t=>txRow(t,true))));

function niceStep(max, n){ const raw=max/n, pow=Math.pow(10,Math.floor(Math.log10(raw))); for(const m of [1,2,2.5,5,10]) if(m*pow>=raw) return m*pow; return 10*pow; }
function barPath(x,y,w,hgt){ const r=Math.min(4,w/2,hgt); return 'M'+x+','+(y+hgt)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+hgt)+'Z'; }
function drawMoneyChart(box, buckets, money){
  const draw = ()=>{
    box.textContent='';
    const W=Math.max(280,box.clientWidth), H=240, m={l:48,r:6,t:10,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b;
    const max=Math.max(0,...buckets.map(b=>Math.max(b.in,b.out)));
    if(!max){ box.appendChild(h('div',{class:'empty'}, S.txns.some(t=>!t.date) && !S.txns.some(t=>t.date) ? 'Your entries don’t have dates yet, so they can’t go on the chart. Open an entry in Recent money and add its date.' : 'No money logged in this period.')); return; }
    const step=niceStep(max,4), top=Math.ceil(max/step)*step, y=n=>m.t+ih-(n/top)*ih;
    const n=buckets.length, band=iw/n, bw=Math.max(2,Math.min(22,(band*0.72-2)/2)), gw=bw*2+2;
    const g=svg('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img','aria-hidden':'true'});
    for(let t=0;t<=top+1e-9;t+=step){ g.append(svg('line',{class:t?'grid':'base',x1:m.l,x2:W-m.r,y1:y(t),y2:y(t)}), svg('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end'},compact(t,money))); }
    const every=Math.ceil(n/Math.max(1,Math.floor(iw/40)));
    const hls=[];
    buckets.forEach((b,i)=>{
      const x0=m.l+i*band+(band-gw)/2;
      const hl=svg('rect',{class:'hl',x:m.l+i*band,y:m.t,width:band,height:ih,rx:4}); hls.push(hl); g.appendChild(hl);
      if(b.in) g.appendChild(svg('path',{class:'b-in',d:barPath(x0,y(b.in),bw,y(0)-y(b.in))}));
      if(b.out) g.appendChild(svg('path',{class:'b-out',d:barPath(x0+bw+2,y(b.out),bw,y(0)-y(b.out))}));
      if(i%every===0 || i===n-1 && (n-1)%every>every/2) g.appendChild(svg('text',{x:m.l+i*band+band/2,y:H-8,'text-anchor':'middle'},b.label));
    });
    box.appendChild(g);
    const tip=h('div',{class:'tip',hidden:true}); box.appendChild(tip);
    let cur=-1;
    const show=i=>{ if(i===cur) return; if(cur>=0) hls[cur].classList.remove('on'); cur=i; if(i<0){ tip.hidden=true; return; }
      const b=buckets[i]; hls[i].classList.add('on');
      tip.textContent=''; tip.append(h('b',null,b.long),h('div',null,h('i',{style:'background:var(--c-in)'}),'In '+rs(b.in,money)),h('div',null,h('i',{style:'background:var(--c-out)'}),'Out '+rs(b.out,money)),h('div',null,'Profit '+signed(b.in-b.out,money)));
      tip.hidden=false; const cx=m.l+i*band+band/2, tw=tip.offsetWidth;
      tip.style.left=Math.min(W-tw,Math.max(0,cx-tw/2))+'px'; tip.style.top=Math.max(0,y(Math.max(b.in,b.out))-tip.offsetHeight-10)+'px'; };
    const idxAt=e=>{ const r=g.getBoundingClientRect(); const i=Math.floor((e.clientX-r.left-m.l)/band); return i>=0&&i<n?i:-1; };
    g.addEventListener('pointermove',e=>show(idxAt(e)));
    g.addEventListener('pointerdown',e=>show(idxAt(e)));
    g.addEventListener('pointerleave',()=>show(-1));
    box.onkeydown=e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); show(Math.max(0,Math.min(n-1,(cur<0?n:cur)+(e.key==='ArrowRight'?1:-1)))); } else if(e.key==='Escape') show(-1); };
    box.onblur=()=>show(-1);

}

function board(cols, onMove, name){
  let dragging=null;
  const moves=id=>{ for(const c of cols){ const k=c.cards.find(x=>x.id===id); if(k) return k.moves; } return []; };
  return h('div',{class:'board','aria-label':name},cols.map(c=>{

        const sel=h('select',{'aria-label':'Move '+k.name+' to',onchange:e=>{ const to=e.target.value; e.target.value=''; if(to) onMove(k.id,to); }},
          h('option',{value:''},'Move to…'), cols.filter(x=>k.moves.includes(x.key)).map(x=>h('option',{value:x.key},x.label)));

          ondragend:()=>{ dragging=null; el.classList.remove('dragging'); }},

const projTasks = p => S.tasks.filter(t=>t.projectId===p.id).sort((a,b)=>(a.done-b.done)||(a.done?(b.doneAt||'').localeCompare(a.doneAt||''):(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||a.order-b.order||a.createdAt-b.createdAt));

function projTime(p){
  const minutes=S.time_entries.filter(e=>e.projectId===p.id).reduce((a,e)=>a+e.minutes,0), got=sumOf(S.txns.filter(t=>t.projectId===p.id)).earned;
  return {minutes, perHour: minutes>0 ? got/(minutes/60) : null};
}
// "1.5h", "1h 30m", "90m", "1:30", or just a number of hours. Returns whole minutes, or null when it isn't a time.
function parseDuration(txt){
  const t=String(txt||'').trim().toLowerCase(); let m;
  if((m=/^(\d+):([0-5]\d)$/.exec(t))) return Number(m[1])*60+Number(m[2]);
  if((m=/^(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)?(?:\s*(\d+)\s*(?:m|min|mins|minutes?))?$/.exec(t))) return Math.round(Number(m[1])*60)+(m[2]?Number(m[2]):0);
  if((m=/^(\d+)\s*(?:m|min|mins|minutes?)$/.exec(t))) return Number(m[1]);
  return null;
}

// Edits a project's whole milestone list: quick splits of the quote, or rows typed by hand. Saving replaces the old list.
// With a quote, the last row holds the rest of it: it updates as the others are typed, and new rows go in above it.
function openMilestonesSheet(p){
  const quote=p.quoted||0, old=projMilestones(p), cu=p.currency;
  const box=h('div',{class:'msrows'}), total=h('div',{class:'total',role:'status'});
  let rows=[], rest=null;
  const amountOf = r => Number(r.amt.value)||0;
  const saved = () => rows.filter(r=>r!==rest || amountOf(r)>0); // a rest of zero isn't saved
  const sync=()=>{
    if(rest){
      const left=cents(quote-rows.filter(r=>r!==rest).reduce((a,r)=>a+amountOf(r),0));
      rest.amt.value=left>0?left:0;
      rest.el.classList.toggle('none',left<=0);
      rest.note.textContent = left>0 ? 'The rest of the quote. It updates as you type the others.' : 'Nothing left: the milestones above cover the quote, so this one won’t be saved.';
    }
    const kept=saved();
    rows.forEach((r,i)=>{ r.name.placeholder=kept.includes(r)?msName(kept.indexOf(r),kept.length):''; r.name.setAttribute('aria-label','Milestone '+(i+1)+' name'); r.amt.setAttribute('aria-label','Milestone '+(i+1)+' amount ('+curSym(cu)+')'); r.due.setAttribute('aria-label','Milestone '+(i+1)+' due date'); });
    const keep=saved(), sum=cents(keep.reduce((a,r)=>a+amountOf(r),0)), off=quote && sum!==cents(quote);
    total.textContent = !keep.length ? 'No milestones. Saving removes them all.'
      : 'Total '+ex(sum,cu)+(!quote?'':!off?' — matches the quote':sum>quote?' — '+ex(sum-quote,cu)+' more than the '+ex(quote,cu)+' quote':' — the quote is '+ex(quote,cu));
    total.className='total'+(off&&keep.length?' warn':'');
  };
  const addRow=(m={},auto)=>{
    const r={ name:h('input',{value:m.name||''}),
      amt:h('input',{type:'number',inputmode:'decimal',min:'0',step:'any',placeholder:'Amount ('+curSym(cu)+')',value:m.amount||'',readonly:!!auto}),
      due:h('input',{type:'date',value:m.dueDate||''}) };
    r.amt.addEventListener('input',sync);
    r.note = auto ? h('div',{class:'hint auto-note'}) : null;
    r.el=h('div',{class:'msrow'+(auto?' rest':'')},r.name,r.amt,r.note,h('div',{class:'msfoot'},r.due,
      h('button',{class:'btn small ghost',type:'button',onclick:()=>{ rows=rows.filter(x=>x!==r); if(r===rest) rest=null; r.el.remove(); sync(); }},'Remove')));
    if(rest && !auto){ rows.splice(rows.indexOf(rest),0,r); box.insertBefore(r.el,rest.el); }
    else { rows.push(r); box.appendChild(r.el); }
    if(auto) rest=r;
    return r;
  };
  const reset=()=>{ const dues=rows.map(r=>r.due.value); rows=[]; rest=null; box.textContent=''; return dues; };
  // Whole units; the last part is the rest, so the total is exactly the quote (as in writes.js).
  const split=parts=>{ const dues=reset();
    parts.forEach((x,i)=>{ const last=i===parts.length-1; addRow({name:msName(i,parts.length),amount:last?'':Math.round(quote*x/100),dueDate:dues[i]},last); }); sync(); };
  const custom=()=>{ const dues=reset(); const first=addRow({name:'Advance',dueDate:dues[0]}); if(quote) addRow({name:'Final payment',dueDate:dues[1]},true); sync(); return first; };
  // Existing milestones keep their amounts; the last one only becomes the rest when they already add up to the quote.
  if(old.length){ const fits=quote && cents(old.reduce((a,m)=>a+m.amount,0))===cents(quote); old.forEach((m,i)=>addRow(m,fits&&i===old.length-1)); }
  else custom();
  sync();
  sheet('Payment milestones',[
    h('p',{class:'muted',style:'margin:0'},p.name+(quote?' · quoted '+ex(quote,cu):' · no quoted price yet')),
    h('div',{class:'splits',role:'group','aria-label':'Quick splits'},
      [['50 / 50',[50,50]],['50 / 30 / 20',[50,30,20]]].map(([l,parts])=>h('button',{class:'btn small',type:'button',disabled:!quote,onclick:()=>split(parts)},l)),
      h('button',{class:'btn small',type:'button',onclick:()=>custom().amt.focus()},'Custom')),
    quote?null:h('div',{class:'hint'},'Set a quoted price on the project to use the quick splits and have the last milestone fill in the rest.'),
    box,
    h('button',{class:'linkbtn',type:'button',onclick:()=>{ const r=addRow(); sync(); r.amt.focus(); }},'+ Add milestone'),
    total
  ], async ()=>{
    const keep=saved(), list=[];
    for(let i=0;i<keep.length;i++){ const r=keep[i], amount=amountOf(r);
      if(!(amount>0)) return fail('Milestone '+(rows.indexOf(r)+1)+' needs an amount above '+ex(0,cu)+'.');
      list.push({project_id:p.id, name:r.name.value.trim()||msName(i,keep.length), amount, due_date:r.due.value||null, sort_order:i}); }
    await api.replaceMilestones(old.map(m=>m.id), list);
  }, 'Save milestones', {noFocus:true});
}

// ---------- invoices ----------
const biz = () => S.settings[0] || map.settings({});
const invOf = id => S.invoices.find(i=>i.id===id);
// PREFIX/2026-27/001: counts up within each financial year and is never reused (same as ledger.js).
// A January start numbers by calendar year (PREFIX/2026/001).
const fyOfDate = d => { const sm=biz().fyStartMonth, y=Number(d.slice(0,4)), st=Number(d.slice(5,7))>=sm?y:y-1; return sm===1 ? String(st) : st+'-'+String(st+1).slice(2); };
function nextInvoiceNumber(prefix, issue){
  const head=prefix+'/'+fyOfDate(issue)+'/';
  const used=S.invoices.map(i=>i.number).filter(n=>n.startsWith(head)).map(n=>Number(n.slice(head.length))).filter(Number.isFinite);
  return head+String(Math.max(0,...used)+1).padStart(3,'0');
}
const addDays = (d,n) => { const x=parseD(d); x.setDate(x.getDate()+n); return ymd(x); };
const daysSince = d => Math.round((parseD(today())-parseD(d))/864e5);
// Paid when its linked payments reach the total; cancelled is never owed; a draft isn't sent yet. Same rules as ledger.js.
function invState(inv){
  const paid=cents(S.txns.filter(t=>t.invoiceId===inv.id && t.type!=='out').reduce((a,t)=>a+t.amount,0)), due=cents(Math.max(0,inv.total-paid));
  const state = inv.status==='cancelled'?'cancelled' : !due||inv.status==='paid'?'paid' : inv.status==='draft'?'draft' : inv.dueDate&&inv.dueDate<today()?'overdue' : paid?'part-paid':'unpaid';
  return {paid, due:['paid','cancelled'].includes(state)?0:due, state, days:state==='overdue'?daysSince(inv.dueDate):0};
}
const INV_STATES = {draft:'Draft',unpaid:'Unpaid','part-paid':'Part paid',overdue:'Overdue',paid:'Paid',cancelled:'Cancelled'};
const owing = x => x.due>0 && x.state!=='draft'; // sent and not fully paid
function upiLink(inv,due){ // UPI only pays rupees
  const b=biz(); if(!b.upiId || !due || inv.currency!=='INR') return null;
  const q={pa:b.upiId, pn:b.businessName||b.upiId, am:due.toFixed(2), cu:'INR', tn:inv.number};
  return 'upi://pay?'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
}
// Drawn with the qrcode-generator library from the CDN. Without it, the UPI ID and link still show.
function qrSvg(text){
  if(!window.qrcode) return null;
  const q=window.qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(), m=4, d=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d.push('M'+(c+m)+','+(r+m)+'h1v1h-1z');
  return svg('svg',{viewBox:'0 0 '+(n+2*m)+' '+(n+2*m),width:'150',height:'150',role:'img','aria-label':'UPI QR code','shape-rendering':'crispEdges','data-upi':text},
    svg('rect',{width:'100%',height:'100%',fill:'#fff'}),svg('path',{d:d.join(''),fill:'#000'}));
}
// Indian numbers: 10 digits means +91 (same as ledger.js).
function waNumber(contact){ const m=String(contact||'').match(/\+?\d[\d\s-]{8,}\d/); if(!m) return null; const d=m[0].replace(/\D/g,''); return d.length===10?'91'+d:d.length>=11&&d.length<=15?d:null; }
// Reminders get firmer after 7 and 30 days overdue.
function reminderText(inv){
  const s=invState(inv), c=clientOf(inv.clientId)||{}, b=biz(), amt=ex(s.due,inv.currency), due=inv.dueDate?fmtDate(inv.dueDate):'';
  const body = s.days>30 ? 'Invoice '+inv.number+' for '+amt+' is now '+s.days+' days overdue. Please make the payment by '+fmtDate(addDays(today(),7))+', or reply with the date you will pay it.'
    : s.days>=7 ? 'Invoice '+inv.number+' for '+amt+' was due on '+due+' and is now '+s.days+' days overdue. Please arrange the payment this week.'
    : 'This is a friendly reminder that invoice '+inv.number+' for '+amt+(s.state==='overdue'?' was due on '+due:due?' is due on '+due:' is due')+'.';
  const pay=[b.upiId&&inv.currency==='INR'?'You can pay by UPI to '+b.upiId+'.':'', b.bankDetails?'Bank transfer:\n'+b.bankDetails:''].filter(Boolean).join('\n');
  return ['Hi'+(c.name?' '+c.name:'')+',', body, pay, 'Thank you'+(b.businessName?',\n'+b.businessName:'')].filter(Boolean).join('\n\n');

// Paid comes from payments, so taking a paid invoice back to Draft or Sent means removing the payments recorded for it.
// Asks first, lists them, and does nothing until confirmed.
function reopenInvoice(inv,to){
  const pays=S.txns.filter(t=>t.invoiceId===inv.id && t.type!=='out'), total=pays.reduce((a,t)=>a+t.amount,0);
  const patch=to==='sent'?{status:'sent',sent_at:inv.sentAt||new Date().toISOString()}:{status:to};
  const set=async()=>{ await api.update('invoices',inv.id,patch); };
  if(!pays.length) return quietly(set);
  confirmSheet('Move '+inv.number+' back to '+(to==='sent'?'Sent':'Draft')+'?',
    'Its payments ('+pays.map(t=>rs(t.amount,inv.currency)+' on '+fmtDate(t.date)).join(', ')+', '+rs(total,inv.currency)+' in all) will be deleted so it is owed again. To keep them, cancel and edit or delete a payment yourself.',
    'Delete payments and move back', async()=>{
      for(const t of pays) await api.del('txns',t.id);
      await set();
    });
}
// Draft → Sent → Paid, or Cancelled. Overdue and part paid stay in Sent with their label. Paid comes from payments,
// so moving a card to Paid opens Record payment; moving a paid card back to Draft or Sent deletes its payments (after asking).
function invoiceBoard(all){
  const col = x => x.state==='cancelled'?'cancelled' : x.state==='paid'?'paid' : x.state==='draft'?'draft' : 'sent';
  const cols=[['draft','Draft'],['sent','Sent'],['paid','Paid'],['cancelled','Cancelled']];
  const sorted=all.slice().sort((a,b)=>b.days-a.days||b.i.issueDate.localeCompare(a.i.issueDate)||b.i.number.localeCompare(a.i.number));
  return board(cols.map(([k,l])=>{
    const xs=sorted.filter(x=>col(x)===k);
    const amt=x=>k==='sent'?x.due:k==='cancelled'?0:x.i.total; // a subtotal per currency
    return { key:k, label:l, sub:curOrder(xs.map(x=>x.i.currency)).map(c=>rs(xs.filter(x=>x.i.currency===c).reduce((a,x)=>a+amt(x),0),c)).join(' + ')||rs(0), cards:xs.map(x=>({ id:x.i.id, name:x.i.number,
      moves: k==='paid' ? ['draft','sent','cancelled'] : ['draft','sent','paid','cancelled'].filter(t=>t!==k && !(k==='cancelled'&&t==='paid')),
      body:[h('a',{class:'title num',href:hrefOf({name:'invoice',id:x.i.id})},x.i.number),
        h('div',{class:'sub'},clientName(x.i.clientId)+(projOf(x.i.projectId)?' · '+projOf(x.i.projectId).name:'')),
        h('div',{class:'num'},rs(owing(x)?x.due:x.i.total,x.i.currency)+(owing(x)&&x.paid?' due':''))],
      chip: x.state==='overdue' ? h('span',{class:'state overdue'},x.days+(x.days===1?' day':' days')+' overdue')
        : ['part-paid','unpaid'].includes(x.state) ? h('span',{class:'state '+x.state},INV_STATES[x.state]+(x.i.dueDate?' · due '+fmtDate(x.i.dueDate):''))
        : h('span',{class:'sub'},'Issued '+fmtDate(x.i.issueDate)) })) };
  }), (id,to)=>{
    const inv=invOf(id), s=invState(inv);
    if(to==='paid') return openMoneySheet({clientId:inv.clientId,projectId:inv.projectId,invoice:inv,amount:s.due||inv.total});

    quietly(()=>api.update('invoices',id,to==='sent'?{status:'sent',sent_at:inv.sentAt||new Date().toISOString()}:{status:to}));
  }, 'Invoices by stage');
}

function openInvoiceSheet(pre={}){
  const inv=pre.invoice, editing=!!inv, b=biz();
  const client=clientPicker('i-client', inv?inv.clientId:pre.clientId);
  const pSel=h('select',{id:'i-project'});
  const fillProjects=()=>{ pSel.textContent=''; pSel.appendChild(h('option',{value:''},'No project'));
    if(client.sel.value!==NEW) sortProjects(S.projects.filter(p=>p.clientId===client.sel.value)).forEach(p=>pSel.appendChild(h('option',{value:p.id},p.name)));
    const want=inv?inv.projectId:pre.projectId; pSel.value = want && [...pSel.options].some(o=>o.value===want) ? want : ''; };
  client.sel.addEventListener('change',fillProjects); fillProjects();
  // An invoice is in its project's currency and never changes it; without a project, pick one.
  const cur=currencySelect('i-cur', inv ? inv.currency : biz().defaultCurrency);
  const lockCur=()=>{ const pr=pSel.value?projOf(pSel.value):null; return pr?pr.currency:null; };
  const syncCur=()=>{ const l=lockCur(); if(editing){ cur.disabled=true; return; } if(l){ cur.value=l; cur.disabled=true; } else cur.disabled=false; sync(); };
  const issue=h('input',{id:'i-issue',type:'date',value:inv?inv.issueDate:today()});
  const due=h('input',{id:'i-due',type:'date',value:inv?(inv.dueDate||''):addDays(today(),b.paymentTermsDays)});
  const number=h('span',{class:'num'},inv?inv.number:nextInvoiceNumber(b.invoicePrefix,today()));
  let dueTouched=editing; due.addEventListener('input',()=>{ dueTouched=true; });
  issue.addEventListener('input',()=>{ if(!issue.value) return; if(!dueTouched) due.value=addDays(issue.value,b.paymentTermsDays); if(!editing) number.textContent=nextInvoiceNumber(b.invoicePrefix,issue.value); });
  const box=h('div',{class:'items'}), total=h('div',{class:'total',role:'status'});
  let rows=[];
  const sync=()=>{ total.textContent='Total '+ex(cents(rows.reduce((a,r)=>a+(Number(r.qty.value)||0)*(Number(r.rate.value)||0),0)),cur.value); 
    rows.forEach((r,i)=>{ r.desc.setAttribute('aria-label','Item '+(i+1)+' description'); r.qty.setAttribute('aria-label','Item '+(i+1)+' quantity'); r.rate.setAttribute('aria-label','Item '+(i+1)+' rate ('+curSym(cur.value)+')'); r.rate.placeholder='Rate ('+curSym(cur.value)+')'; }); };
  const addItem=(it={})=>{
    const r={ desc:h('input',{placeholder:'What it’s for',value:it.description||''}),
      qty:h('input',{type:'number',inputmode:'decimal',min:'0',step:'any',value:it.quantity??1}),
      rate:h('input',{type:'number',inputmode:'decimal',min:'0',step:'any',placeholder:'Rate',value:it.rate||''}) };
    r.qty.addEventListener('input',sync); r.rate.addEventListener('input',sync);
    r.el=h('div',{class:'itemrow'},r.desc,h('div',{class:'itemnums'},r.qty,r.rate,h('button',{class:'btn small ghost',type:'button',onclick:()=>{ rows=rows.filter(x=>x!==r); r.el.remove(); sync(); }},'Remove')));
    rows.push(r); box.appendChild(r.el); return r;
  };
  (inv?inv.items:pre.items||[{}]).forEach(addItem);
  cur.addEventListener('change',sync); pSel.addEventListener('change',syncCur); client.sel.addEventListener('change',syncCur); syncCur(); sync();
  const notes=h('textarea',{id:'i-notes',placeholder:'e.g. Thank you for your business'}); notes.value=inv?inv.notes:b.invoiceNotes;
  sheet(editing?'Edit '+inv.number:'New invoice',[
    h('p',{class:'muted',style:'margin:0'},'Invoice ',number,pre.milestoneName?' · for the '+pre.milestoneName+' milestone':''),
    h('div',{class:'two'},h('div',{class:'field'},h('label',{for:'i-client'},'Client'),client.sel,client.box),field('i-project','Project',pSel)),
    field('i-cur','Currency',cur,editing?'An invoice keeps its currency':lockCur()?'Same as its project':null),
    h('div',{class:'two'},field('i-issue','Issue date',issue),field('i-due','Due date',due,'Your payment terms: '+b.paymentTermsDays+(b.paymentTermsDays===1?' day':' days'))),
    h('div',{class:'field'},h('span',{class:'hint',style:'font-weight:600;font-size:13px'},'Items'),box,h('button',{class:'linkbtn',type:'button',onclick:()=>{ addItem().desc.focus(); sync(); }},'+ Add item')),
    total,
    field('i-notes','Notes on the invoice',notes)
  ], async ()=>{
    const items=[];
    for(let i=0;i<rows.length;i++){ const r=rows[i], d=r.desc.value.trim(), q=Number(r.qty.value), rate=Number(r.rate.value);
      if(!d) return fail('Item '+(i+1)+' needs a description.');
      if(!(q>0)) return fail('Item '+(i+1)+' needs a quantity above 0.');
      if(!(rate>0)) return fail('Item '+(i+1)+' needs a rate above '+ex(0,cur.value)+'.');
      items.push({description:d, quantity:q, rate}); }
    if(!items.length) return fail('Add at least one item.');
    if(!issue.value) return fail('Pick the issue date.');
    if(due.value && due.value<issue.value) return fail('The due date can’t be before the issue date.');
    const lock=lockCur();
    if(editing && lock && lock!==inv.currency) return fail(projOf(pSel.value).name+' is in '+lock+', but this invoice is in '+inv.currency+'. An invoice has to be in the same currency as its project.');
    const cid=await client.resolve(); if(!cid) return false;
    const row={client_id:cid, project_id:pSel.value||null, currency:cur.value, issue_date:issue.value, due_date:due.value||null, items, total:cents(items.reduce((a,i)=>a+i.quantity*i.rate,0)), notes:notes.value.trim()};
    if(editing) await api.update('invoices',inv.id,row);
    else { const id=await api.insert('invoices',{...row, milestone_id:pre.milestoneId||null, number:nextInvoiceNumber(b.invoicePrefix,issue.value), status:'draft'}); go({name:'invoice',id}); }
  }, editing?'Save changes':'Create invoice', {noFocus:!!pre.items});
}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const daysIn = m => new Date(2001,m,0).getDate(); // days in month m (1 = January)
const fyWords = m => m===1 ? 'Your financial year is the calendar year: 1 January to 31 December.'
  : 'Your financial year runs from 1 '+MONTHS[m-1]+' to '+daysIn(m-1)+' '+MONTHS[m-2]+'.';

// A card with its own Save button. onSave returns an error message, or the changes to save.
function settingsCard(key,title,intro,body,onSave,label){
  const err=h('div',{class:'err',role:'alert'}), btn=h('button',{class:'btn primary',type:'submit'},label);
  const form=h('form',{class:'card settings-card','aria-label':title,'data-section':key,novalidate:true},
    h('h2',null,title), intro?h('p',{class:'muted',style:'margin:0'},intro):null, body, err,
    h('div',{class:'save-row'},btn,S.settingsSaved===key?h('span',{class:'hint saved',role:'status'},'Saved.'):null));
  form.addEventListener('submit',e=>{
    e.preventDefault(); err.textContent='';
    const r=onSave(); if(typeof r==='string'){ err.textContent=r; return; }
    S.settingsSaved=key; saveSettings(r); // the screen updates at once; the save goes on in the background

  return form;

// The region inputs, shared by the Settings page and the first-run screen. read() returns an error message or the changes to save.

  const fy=h('select',{id:'s-fy'},MONTHS.map((m,i)=>h('option',{value:String(i+1)},m))); fy.value=String(b.fyStartMonth);
  const zones=(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):['Asia/Kolkata','Asia/Dubai','Asia/Singapore','Europe/London','Europe/Berlin','America/New_York','America/Chicago','America/Los_Angeles','Australia/Sydney','Pacific/Auckland']);
  const tz=h('input',{id:'s-tz',list:'s-tz-list',value:b.timezone,autocapitalize:'off',spellcheck:'false',autocomplete:'off'});

  const loc=h('select',{id:'s-locale'},LOCALES.map(([k,l])=>h('option',{value:k},l+' · '+new Intl.NumberFormat(k).format(1234567.89)))); loc.value=b.locale;

}

// ---------- renewals ----------
// A cycle moves the date by whole months, landing on the last day of shorter months (same as ledger.js).
const CYCLES = [['monthly','Monthly',1],['quarterly','Every 3 months',3],['yearly','Yearly',12]];
const cycleMonths = c => (CYCLES.find(x=>x[0]===c)||CYCLES[2])[2];
const KINDS = [['domain','Domain','Domain'],['hosting','Hosting','Hosting'],['ssl','SSL','Software & plugins'],['maintenance','Maintenance','Other'],['email','Email','Software & plugins'],['other','Other','Other']];
const kindOf = k => KINDS.find(x=>x[0]===k)||KINDS[5];
function addMonths(d,n){ const y=Number(d.slice(0,4)), m=Number(d.slice(5,7))-1+n, day=Number(d.slice(8,10)); const last=new Date(y,m+1,0).getDate(); return ymd(new Date(y,m,Math.min(day,last))); }
const sortServices = arr => arr.slice().sort((a,b)=>(b.active-a.active)||a.nextRenewal.localeCompare(b.nextRenewal));
const yearly = x => 12/cycleMonths(x.cycle);
function serviceWhen(x){
  if(!x.active) return 'Stopped';
  const d=-daysSince(x.nextRenewal);
  return d<0 ? 'Was due '+fmtDate(x.nextRenewal)+' · '+(-d)+(d===-1?' day':' days')+' overdue' : d===0 ? 'Renews today' : 'Renews '+fmtDate(x.nextRenewal)+' · in '+d+(d===1?' day':' days');
}
function serviceRow(x, showClient){ // each service in its own currency
  const overdue=x.active && x.nextRenewal<today();
  return h('div',{class:'svcrow'},
    h(canWrite()?'button':'div',{class:'grow',type:canWrite()?'button':null,'aria-label':canWrite()?'Edit '+x.name:null,onclick:canWrite()?()=>openServiceSheet({service:x}):null},
      h('div',{class:'title'},x.name),
      h('div',{class:'sub'},[showClient?clientName(x.clientId):null, kindOf(x.kind)[1], rs(x.price,x.currency)+' '+(CYCLES.find(c=>c[0]===x.cycle)||CYCLES[2])[1].toLowerCase()].filter(Boolean).join(' · ')),
      h('div',{class:'sub'+(overdue?' out':'')},serviceWhen(x))),
    canWrite()&&x.active?h('button',{class:'btn small'+(overdue?' primary':''),type:'button',onclick:()=>openRenewSheet(x)},'Renew'):null);
}

// Sign-up is invite-only: the database refuses any email that isn't on the owner's allow-list (allowed_emails in schema.sql).
// Supabase hides the trigger's own message behind "Database error saving new user", so both mean "not invited".
const notInvited = e => /invited|database error saving new user/i.test((e && e.message) || '');
function renderLogin(v){
  if(S.loginMode==='sent') return v.appendChild(h('div',{class:'login',role:'status'},
    h('h1',null,'Check your email'),
    h('p',{style:'margin:0'},'We sent a link to ',h('strong',null,S.loginEmail),'. Open it to confirm your account, then sign in.'),
    h('p',{class:'muted',style:'margin:0'},'Nothing there after a few minutes? Look in your spam folder. If you already have an account, just sign in.'),
    h('button',{class:'btn primary',type:'button',style:'justify-content:center',onclick:()=>{ S.loginMode='signin'; render(); }},'Back to sign in')));
  const join = S.loginMode==='signup';
  const email=h('input',{id:'l-email',type:'email',autocomplete:'email',required:true,placeholder:'you@example.com',value:S.loginEmail||''});
  const pass=h('input',{id:'l-pass',type:'password',autocomplete:join?'new-password':'current-password',required:true,minlength:join?'8':null});
  const err=h('div',{class:'err',role:'alert'});
  const btn=h('button',{class:'btn primary',type:'submit',style:'justify-content:center'},join?'Create account':'Sign in');
  const reset=join?null:h('button',{class:'linkbtn',type:'button'},'Forgot password?');
  const swap=h('button',{class:'linkbtn',type:'button',id:'l-switch',onclick:()=>{ S.loginMode=join?'signin':'signup'; S.loginEmail=email.value; render(); }},join?'Already have an account? Sign in':'New here? Create an account');
  const form=h('form',{class:'login',novalidate:true},
    h('h1',null,join?'Create your account':'Client Ledger'),
    h('div',{class:'muted'},join?'Invite only while we test it: use the email you sent us.':'Private. Sign in to see your projects and money.'),
    h('div',{class:'field'},h('label',{for:'l-email'},'Email'),email),
    h('div',{class:'field'},h('label',{for:'l-pass'},join?'Choose a password (8+ characters)':'Password'),pass),
    err, btn, reset, swap);
  form.addEventListener('submit',async e=>{
    e.preventDefault(); err.textContent='';
    const em=email.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ err.textContent='Type your email address.'; return; }
    if(join && pass.value.length<8){ err.textContent='Use at least 8 characters for your password.'; return; }
    if(!join && !pass.value){ err.textContent='Type your password.'; return; }
    btn.disabled=true;
    if(!join){
      const { error } = await sb.auth.signInWithPassword({ email:em, password:pass.value });
      btn.disabled=false;
      if(error) err.textContent = /invalid/i.test(error.message) ? 'Wrong email or password.' : /not confirmed/i.test(error.message) ? 'Confirm your email first: open the link we sent you.' : error.message;
      return;
    }
    const { data, error } = await sb.auth.signUp({ email:em, password:pass.value, options:{ emailRedirectTo: location.origin + location.pathname } });
    btn.disabled=false;
    if(error){ err.textContent = notInvited(error) ? 'This email hasn’t been invited yet. Send it to the person who invited you and try again once they’ve added it.' : error.message; return; }
    if(data && data.session) return; // no confirmation needed: signed in already, and the first-run screen follows
    // An email that already has an account gets the same answer, so nobody can find out who has signed up.
    S.loginMode='sent'; S.loginEmail=em; render();
  });
  if(reset) reset.addEventListener('click',async ()=>{
    err.textContent='';
    if(!email.value.trim()){ err.textContent='Type your email first, then tap Forgot password.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.origin + location.pathname });
    err.textContent = error ? error.message : 'If that email has an account, a reset link is on its way.';
  });
  v.appendChild(form); (email.value?pass:email).focus();
}

let loadGen=0, writeSeq=0, pending=0, needsSync=false, writes=Promise.resolve();

  const res = await Promise.all(TABLES.map(t=>sb.from(t).select('*')));
  if(gen!==loadGen || seq!==writeSeq || (S.ready && pending>0)) return;
  const bad = res.find((r,i)=>r.error && !OPTIONAL.includes(TABLES[i]));
  if(bad){ S.error='Couldn’t load your ledger: '+bad.error.message; render(); return; }
  const next = TABLES.map((t,i)=>res[i].error?[]:res[i].data);
  if(quiet && S.ready && TABLES.every((t,i)=>JSON.stringify(next[i])===JSON.stringify(S.raw[t]))) return;
  TABLES.forEach((t,i)=>setRaw(t,next[i]));
  S.settingsLoaded=!res[TABLES.indexOf('settings')].error; // a missing settings table never shows the first-run screen
  S.ready=true; S.error=''; render();
}
// S.raw holds the rows as the database has them; S.clients, S.projects… are those rows turned into what the screens use.
const raw = t => S.raw[t] || (S.raw[t]=[]);
function setRaw(t,rows){ S.raw[t]=rows; S[t]=rows.map(map[t]); }
const remap = () => TABLES.forEach(t=>setRaw(t,raw(t)));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
// What the database does to other rows when one is deleted (cascade = delete them too, null = clear the link). tests/consistency.test.js keeps this in step with schema.sql.
const ON_DELETE = {
  clients: [['projects','client_id','cascade'],['txns','client_id','cascade'],['invoices','client_id','cascade'],['services','client_id','cascade']],
  projects: [['milestones','project_id','cascade'],['tasks','project_id','cascade'],['time_entries','project_id','cascade'],['txns','project_id','null'],['invoices','project_id','null'],['services','project_id','null']],
  milestones: [['invoices','milestone_id','null']],
  invoices: [['txns','invoice_id','null']]
};
function dropRow(t,id){
  S.raw[t]=raw(t).filter(r=>r.id!==id);
  for(const [child,col,how] of ON_DELETE[t]||[]){
    if(how==='cascade') raw(child).filter(r=>r[col]===id).forEach(r=>dropRow(child,r.id));
    else S.raw[child]=raw(child).map(r=>r[col]===id?{...r,[col]:null}:r);
  }
}
// Saves go to the database one after another, in the background, so a payment for a brand-new project still lands after the project.
// If one fails the screen goes back to what the database really has, and a message says so.
function send(fn){
  pending++; writeSeq++;
  writes = writes.then(async()=>{
    try{ await fn(); }
    catch(e){ console.warn(e); toast(saveErrText(e)); needsSync=true; }
    finally{ pending--; if(!pending && needsSync){ needsSync=false; await load(true); } }
  });
  return writes;
}
// Every save shows on screen at once; the database catches up behind it.
const api = {
  async insert(table,row){
    const id = row.id || uuid();
    setRaw(table, raw(table).concat([{...row, id, created_at:new Date().toISOString()}]));
    render();
    send(async()=>{ const { error } = await sb.from(table).insert({...row, id}); if(error) throw error; });
    return id;
  },
  async update(table,id,row){
    setRaw(table, raw(table).map(r=>r.id===id?{...r,...row}:r));
    render();
    send(async()=>{ const { error } = await sb.from(table).update(row).eq('id',id); if(error) throw error; });
  },
  async del(table,id){
    dropRow(table,id); remap(); render();
    needsSync = true; // deleting touches other rows, so check the result against the database once the saves are done
    send(async()=>{ const { error } = await sb.from(table).delete().eq('id',id); if(error) throw error; });
  },
  // The new list goes in before the old rows come out, so a failed save never loses the old milestones.
  async replaceMilestones(oldIds,rows){
    const now=new Date().toISOString(), fresh=rows.map(r=>({...r, id:uuid(), created_at:now}));
    oldIds.forEach(id=>dropRow('milestones',id));
    setRaw('milestones', raw('milestones').concat(fresh)); remap(); render();
    needsSync = true;
    send(async()=>{
      if(fresh.length){ const { error } = await sb.from('milestones').insert(fresh); if(error) throw error; }
      for(const id of oldIds){ const { error } = await sb.from('milestones').delete().eq('id',id); if(error) throw error; }
    });
  }
};
function openNewPasswordSheet(){
  const p=h('input',{id:'np',type:'password',autocomplete:'new-password',minlength:'8',required:true});
  sheet('Set a new password',[field('np','New password (8+ characters)',p)], async ()=>{
    if(p.value.length<8) return fail('Use at least 8 characters.');
    const { error } = await sb.auth.updateUser({ password:p.value });
    if(error) return fail(error.message);
  }, 'Save password');
}
db = sb;
S.view = parseHash();
$('#signout').addEventListener('click',()=>sb && sb.auth.signOut());
render();
if(!sb){
  S.authReady=true; S.session={}; S.error='The app isn’t set up yet. Add your Supabase project URL and anon key to config.js.'; render();
} else {
  // Changes made elsewhere (through Claude, or on another device) show up when you come back to the tab.
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.ready && S.session && S.session.user) load(true); });
  sb.auth.onAuthStateChange((event, session)=>{
    S.authReady=true; S.session=session;
    if(event==='PASSWORD_RECOVERY') setTimeout(openNewPasswordSheet,0);
    if(session){ if(event!=='TOKEN_REFRESHED') setTimeout(load,0); }
    else { S.clients=[]; S.projects=[]; S.txns=[]; S.milestones=[]; S.invoices=[]; S.settings=[]; S.services=[]; S.tasks=[]; S.time_entries=[]; S.raw={}; S.ready=false; S.settingsLoaded=false; closeSheet(); render(); }
  });
}
})();
</script>
