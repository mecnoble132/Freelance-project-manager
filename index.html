<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Client Ledger</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header with tabs (Dashboard, Projects, Clients, Money); each tab is one page; a project or client opens its own page; a bottom sheet adds and edits things. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --fg:#141821; --muted:#5d6577; --line:#e1e5ec;
  --accent:#2b4fd8; --accent-ink:#ffffff; --in:#17855a; --out:#c23d2a; --in-soft:#e3f4ec; --out-soft:#fbe9e6;
  --c-in:#2a78d6; --c-out:#eb6834; /* chart series: money in / money out (colour-blind safe pair) */
  --shadow:0 1px 2px rgba(20,24,33,.06),0 8px 24px rgba(20,24,33,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#181c25; --fg:#eef0f5; --muted:#9aa2b4; --line:#2a303d;
  --accent:#7d95ff; --accent-ink:#0f1218; --in:#4fd197; --out:#ff8a76; --in-soft:#173329; --out-soft:#3a1f1b;
  --c-in:#3987e5; --c-out:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#181c25; --fg:#eef0f5; --muted:#9aa2b4; --line:#2a303d;
  --accent:#7d95ff; --accent-ink:#0f1218; --in:#4fd197; --out:#ff8a76; --in-soft:#173329; --out-soft:#3a1f1b;
  --c-in:#3987e5; --c-out:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden}
.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px 20px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
@media (max-width:640px){.top{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;grid-row:2}}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:28px;letter-spacing:-.01em}
.card{background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:17px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,30px);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-head h2{font-size:18px;font-weight:600}
.list{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card .list{box-shadow:none;border:1px solid var(--line);border-radius:12px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:none}
button.row,a.row{width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
button.row:last-child,a.row:last-child{border-bottom:none}
button.row:hover,a.row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.avatar{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent)}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.in{background:var(--in)} .dot.out{background:var(--out)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--out);border-color:var(--out);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--out)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:focus-visible,button.row:focus-visible,a.row:focus-visible,.tabs a:focus-visible,.chart:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.card .empty{background:none}
.back{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px 0;align-self:flex-start;text-decoration:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--out);font-size:14px}
.notice{background:var(--panel);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.notice .linkbtn{font-size:14px;font-weight:600}
.login{width:100%;max-width:380px;margin:10vh auto 0;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0;align-self:flex-start}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:11px;box-shadow:var(--shadow);flex-wrap:wrap}
.pills button{font:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;padding:6px 10px;background:none;color:var(--muted);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pills button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{max-width:260px}
/* status badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--fg);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.badge.active::before{background:var(--accent)}
.badge.lead::before{background:transparent;border:1.5px solid var(--muted)}
.badge.done::before{background:var(--in)}
.badge.paused::before{background:var(--muted);border-radius:1px}
/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;color:inherit;text-decoration:none}
.pcard:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.pcard h3{font-size:17px;font-weight:600;font-family:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .desc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;margin:0}
.ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.links{display:flex;gap:6px;flex-wrap:wrap}
.link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.link:hover{text-decoration:underline}
.link.none{color:var(--muted);background:var(--bg);font-weight:500}
.link svg{width:14px;height:14px;flex:none}
.progress{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--in);border-radius:999px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.mini div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mini .l{color:var(--muted);font-size:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;font-size:14px}
.facts .l{display:block;font-size:12px;color:var(--muted)}
.prose{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
/* charts */
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;border-radius:8px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .b-in{fill:var(--c-in)} .chart .b-out{fill:var(--c-out)}
.chart .hl{fill:var(--fg);opacity:0}
.chart .hl.on{opacity:.06}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:nowrap;box-shadow:var(--shadow);z-index:3}
.tip b{display:block;font-weight:600}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--c-out);border-radius:0 4px 4px 0}
details.tbl summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px!important}}
.sheet{background:var(--panel);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:90px}
.amount{font-family:var(--mono);font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{font:inherit;font-weight:600;border:none;border-radius:9px;padding:10px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"].in{background:var(--in);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--out);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.state{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.state.paid{color:var(--in)} .state.overdue{background:var(--out);color:#fff}
.overdue-note{font-size:13px;font-weight:600;color:var(--out)}
.splits{display:flex;gap:6px;flex-wrap:wrap}
.msrows{display:flex;flex-direction:column;gap:10px}
.msrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9em);gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.msrow .msfoot{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.msrow .msfoot input{flex:1;min-width:0}
.msrow.rest{border-style:dashed}
.msrow.rest input[readonly]{background:var(--panel);color:var(--muted)}
.msrow.none{opacity:.6}
.msrow .auto-note{grid-column:1/-1}
.total{font-size:14px;font-weight:600} .total.warn{color:var(--out)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.newbox{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot .ghost{margin-right:auto}
@media (max-width:480px){.two,.three{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.state.cancelled{text-decoration:line-through}
.pre{white-space:pre-line}
.items{display:flex;flex-direction:column;gap:8px}
.itemrow{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.itemnums{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:6px;align-items:center}
.invoice{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:22px;max-width:820px;width:100%;box-sizing:border-box}
.inv-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.inv-biz{font-size:20px;font-weight:700}
.inv-word{font-size:26px;font-weight:700;letter-spacing:.02em}
.inv-title{text-align:right}
.inv-muted{color:var(--muted);font-size:14px}
.inv-meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;font-size:14px}
.inv-meta .l,.inv-pay .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
.inv-items{font-size:14px;margin:0}
.inv-items th:first-child,.inv-items td:first-child{text-align:left}
.inv-items td{padding:9px 8px;overflow-wrap:anywhere}
.inv-items tfoot td{border:none;font-weight:600}
.inv-items tfoot .due td{font-size:17px}
.inv-pay{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;font-size:14px}
.inv-pay>div{display:flex;flex-direction:column;gap:4px}
.qr svg{display:block;border-radius:8px}
.inv-notes{font-size:14px;color:var(--muted)}
.stamp{display:inline-block;margin-top:6px;border:2px solid currentColor;border-radius:6px;padding:2px 10px;font-weight:700;text-transform:uppercase;font-size:13px}
.stamp.paid{color:var(--in)} .stamp.cancelled{color:var(--out)}
@media (max-width:560px){.inv-meta{grid-template-columns:1fr 1fr}.inv-meta>div:first-child{grid-column:1/-1}.invoice{padding:18px}.inv-title{text-align:left}}
/* Boards: columns side by side, scrolling sideways inside the board (never the page) on small screens. */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
@media (max-width:640px){.board{grid-auto-columns:84%}}
.bcol{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0;scroll-snap-align:start}
.bcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px}
.bhead h2{font-size:15px}
.bcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:grab}
.bcard.dragging{opacity:.45}
.bcard .title{font-weight:600;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .title:hover{color:var(--accent)}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.bcard select{font-size:12px;padding:4px 8px;width:auto;border-radius:8px}
.bcard .state:not(.overdue){background:var(--panel)}
.bempty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.view-pills button{padding:6px 12px}
.svcrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.svcrow:last-child{border-bottom:none}
.sub.out{color:var(--out)}
.svcrow .grow{background:none;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.svcrow .right{flex-shrink:0}
.renew-steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.renew-steps label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.renew-steps input{width:auto;margin-top:3px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}
/* Print (Save as PDF): just the invoice, in black on white, on one A4 page. */
@media print{
  @page{size:A4;margin:12mm}
  :root{--panel:#fff;--bg:#fff;--fg:#000;--muted:#555;--line:#ccc}
  body{background:#fff;color:#000;font-size:13px}
  .top,.no-print,.back,#sheet-root{display:none!important}
  .app{padding:0;max-width:none;gap:0}
  .invoice{box-shadow:none;border-radius:0;padding:0;max-width:none}
}
</style>

<script src="config.js"></script>
<script>
(function(){
const S = { clients:[], projects:[], txns:[], milestones:[], invoices:[], settings:[], services:[], iFilter:'open', view:{name:'home'}, ready:false, error:'', session:null, authReady:false,
  period:pref('period','this_fy'), pView:pref('projectView','list'), iView:pref('invoiceView','list'), pStatus:'open', pQuery:'', mType:'all', mQuery:'' };

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
const fmtDate = d => d ? parseD(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : 'Earlier';
function h(tag, attrs, ...kids){ const el=document.createElement(tag); if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue; if(k==='class') el.className=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?'':v);} kids.flat().forEach(c=>{ if(c==null||c===false) return; el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c); }); return el; }

// What a project has brought in, cost, is still owed, and is overdue on its milestones. Leads aren't owed anything yet.
function projStats(p){ const s=sumOf(S.txns.filter(t=>t.projectId===p.id)); return {...s, quoted:p.quoted||0, due: p.status==='lead' ? 0 : Math.max(0,(p.quoted||0)-s.earned),
  overdue: projMilestones(p).reduce((a,m)=>a+(m.state==='overdue'?m.left:0),0)}; }
// The project's money in pays off its milestones in order. One is overdue when its due date has passed and it isn't fully paid. Same rules as ledger.js.
const cents = n => Math.round(n*100)/100;
function projMilestones(p){
  let left=sumOf(S.txns.filter(t=>t.projectId===p.id)).earned; const t=today();
  return S.milestones.filter(m=>m.projectId===p.id).sort((a,b)=>a.order-b.order||a.createdAt-b.createdAt).map(m=>{
    const paid=cents(Math.min(m.amount,left)); left=cents(left-paid); const owing=cents(m.amount-paid);
    const overdue=owing>0 && p.status!=='lead' && !!m.dueDate && m.dueDate<t;
    return {...m, paid, left:owing, state:!owing?'paid':overdue?'overdue':paid?'part-paid':'unpaid'};
  });
}

// Indian financial years run April to March. fyStart() is the year the current one began: 2026 for FY 2026–27.
const fyStart = () => { const t=today(); return Number(t.slice(0,4)) - (Number(t.slice(5,7))<4 ? 1 : 0); };
const fyLabel = y => 'FY '+y+'–'+String(y+1).slice(2);
const fyRange = y => [y+'-04-01', (y+1)+'-03-31'];
const PERIODS = [['this_fy',fyLabel(fyStart()),'This financial year'],['last_fy',fyLabel(fyStart()-1),'Last financial year'],['month','This month'],['12m','Last 12 months'],['year','This year'],['all','All time']];
// The chart's buckets for a period: days for this month, months otherwise. A transaction falls in a bucket when its date starts with the key.
function periodBuckets(p){
  const now=new Date(), out=[];
  if(p==='month'){ for(let d=1; d<=now.getDate(); d++){ const dt=new Date(now.getFullYear(),now.getMonth(),d); out.push({key:ymd(dt),label:String(d),long:dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}); } return out; }
  let start;
  let end=now;
  if(p==='12m') start=new Date(now.getFullYear(),now.getMonth()-11,1);
  else if(p==='year') start=new Date(now.getFullYear(),0,1);
  else if(p==='this_fy') start=new Date(fyStart(),3,1);
  else if(p==='last_fy'){ start=new Date(fyStart()-1,3,1); end=new Date(fyStart(),2,1); }
  else { const first=S.txns.map(t=>t.date).filter(Boolean).sort()[0]; start = first ? parseD(first.slice(0,7)+'-01') : new Date(now.getFullYear(),now.getMonth()-11,1);
    const min=new Date(now.getFullYear(),now.getMonth()-11,1); if(start>min) start=min; }
  for(let d=new Date(start.getFullYear(),start.getMonth(),1); d<=end; d=new Date(d.getFullYear(),d.getMonth()+1,1))
    out.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),label:d.toLocaleDateString('en-IN',{month:'short'}),long:d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})});
  return out;
}
function inPeriod(t,p){ if(p==='all') return true; if(!t.date) return false; const now=new Date();
  if(p==='month') return t.date.startsWith(today().slice(0,7));
  if(p==='year') return t.date.startsWith(String(now.getFullYear()));
  if(p==='this_fy'||p==='last_fy'){ const [a,b]=fyRange(fyStart()-(p==='last_fy'?1:0)); return t.date>=a && t.date<=b; }
  return t.date >= ymd(new Date(now.getFullYear(),now.getMonth()-11,1)); }

  const hasChart = buckets.some(b=>b.in||b.out);

    h('div',{class:'card-head'},h('h2',null,'Money in and out'),
      h('div',{class:'legend'},h('span',null,h('i',{style:'background:var(--c-in)'}),'Money in'),h('span',null,h('i',{style:'background:var(--c-out)'}),'Money out'))),
    chartBox, hasChart ? table : null,
    S.txns.some(t=>!t.date) && p==='all' && S.txns.some(t=>t.date) ? h('div',{class:'hint'},'Entries with no date aren’t on the chart, but are counted in the totals above.') : null);

  const top = stats.map(s=>({...s, ...sumOf(tx.filter(t=>t.projectId===s.p.id))})).filter(s=>s.earned||s.spent).sort((a,b)=>b.profit-a.profit).slice(0,6);

const periodLabel = p => (PERIODS.find(x=>x[0]===p)||[])[1];
// Entries without a date can't be placed in a period, so they only count under All time. Say so instead of silently leaving them out.
function undatedNote(){
  const n=S.txns.filter(t=>!t.date).length;
  if(!n || S.period==='all') return null;
  return h('div',{class:'notice'},n+(n===1?' entry has':' entries have')+' no date, so '+(n===1?'it only counts':'they only count')+' under All time. ',
    h('button',{class:'linkbtn',type:'button',onclick:()=>{S.period='all';setPref('period','all');render();}},'Show all time'));
}
function kpi(label, value, sub, tone){ return h('div',{class:'kpi'},h('div',{class:'eyebrow'},label),h('div',{class:'v'+(tone?' '+tone:''),title:value},value),h('div',{class:'s'},sub)); }

function niceStep(max, n){ const raw=max/n, pow=Math.pow(10,Math.floor(Math.log10(raw))); for(const m of [1,2,2.5,5,10]) if(m*pow>=raw) return m*pow; return 10*pow; }
function barPath(x,y,w,hgt){ const r=Math.min(4,w/2,hgt); return 'M'+x+','+(y+hgt)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+hgt)+'Z'; }
function drawMoneyChart(box, buckets){
  const draw = ()=>{
    box.textContent='';
    const W=Math.max(280,box.clientWidth), H=240, m={l:48,r:6,t:10,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b;
    const max=Math.max(0,...buckets.map(b=>Math.max(b.in,b.out)));
    if(!max){ box.appendChild(h('div',{class:'empty'}, S.txns.some(t=>!t.date) && !S.txns.some(t=>t.date) ? 'Your entries don’t have dates yet, so they can’t go on the chart. Open an entry in Recent money and add its date.' : 'No money logged in this period.')); return; }
    const step=niceStep(max,4), top=Math.ceil(max/step)*step, y=n=>m.t+ih-(n/top)*ih;
    const n=buckets.length, band=iw/n, bw=Math.max(2,Math.min(22,(band*0.72-2)/2)), gw=bw*2+2;
    const g=svg('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img','aria-hidden':'true'});
    for(let t=0;t<=top+1e-9;t+=step){ g.append(svg('line',{class:t?'grid':'base',x1:m.l,x2:W-m.r,y1:y(t),y2:y(t)}), svg('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end'},compact(t))); }
    const every=Math.ceil(n/Math.max(1,Math.floor(iw/40)));
    const hls=[];
    buckets.forEach((b,i)=>{
      const x0=m.l+i*band+(band-gw)/2;
      const hl=svg('rect',{class:'hl',x:m.l+i*band,y:m.t,width:band,height:ih,rx:4}); hls.push(hl); g.appendChild(hl);
      if(b.in) g.appendChild(svg('path',{class:'b-in',d:barPath(x0,y(b.in),bw,y(0)-y(b.in))}));
      if(b.out) g.appendChild(svg('path',{class:'b-out',d:barPath(x0+bw+2,y(b.out),bw,y(0)-y(b.out))}));
      if(i%every===0 || i===n-1 && (n-1)%every>every/2) g.appendChild(svg('text',{x:m.l+i*band+band/2,y:H-8,'text-anchor':'middle'},b.label));
    });
    box.appendChild(g);
    const tip=h('div',{class:'tip',hidden:true}); box.appendChild(tip);
    let cur=-1;
    const show=i=>{ if(i===cur) return; if(cur>=0) hls[cur].classList.remove('on'); cur=i; if(i<0){ tip.hidden=true; return; }
      const b=buckets[i]; hls[i].classList.add('on');
      tip.textContent=''; tip.append(h('b',null,b.long),h('div',null,h('i',{style:'background:var(--c-in)'}),'In '+rs(b.in)),h('div',null,h('i',{style:'background:var(--c-out)'}),'Out '+rs(b.out)),h('div',null,'Profit '+signed(b.in-b.out)));
      tip.hidden=false; const cx=m.l+i*band+band/2, tw=tip.offsetWidth;
      tip.style.left=Math.min(W-tw,Math.max(0,cx-tw/2))+'px'; tip.style.top=Math.max(0,y(Math.max(b.in,b.out))-tip.offsetHeight-10)+'px'; };
    const idxAt=e=>{ const r=g.getBoundingClientRect(); const i=Math.floor((e.clientX-r.left-m.l)/band); return i>=0&&i<n?i:-1; };
    g.addEventListener('pointermove',e=>show(idxAt(e)));
    g.addEventListener('pointerdown',e=>show(idxAt(e)));
    g.addEventListener('pointerleave',()=>show(-1));
    box.onkeydown=e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); show(Math.max(0,Math.min(n-1,(cur<0?n:cur)+(e.key==='ArrowRight'?1:-1)))); } else if(e.key==='Escape') show(-1); };
    box.onblur=()=>show(-1);
  };
  requestAnimationFrame(draw);
  box._redraw=draw;
}

const ICONS = {

  globe:'M12 22a10 10 0 100-20 10 10 0 000 20zM2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20',

// A board: one column per stage. Drag a card to another column, or use its Move to menu (which also works on
// phones and with a keyboard). cols: [{key, label, sub, cards:[{id, el, moves}]}]; moves lists the columns a card may go to.
function board(cols, onMove, name){
  let dragging=null;
  const moves=id=>{ for(const c of cols){ const k=c.cards.find(x=>x.id===id); if(k) return k.moves; } return []; };
  return h('div',{class:'board','aria-label':name},cols.map(c=>{
    const col=h('section',{class:'bcol','data-col':c.key,'aria-label':c.label},
      h('div',{class:'bhead'},h('h2',null,c.label),h('span',{class:'sub num'},c.sub)),
      c.cards.length ? c.cards.map(k=>{
        const sel=h('select',{'aria-label':'Move '+k.name+' to',onchange:e=>{ const to=e.target.value; e.target.value=''; if(to) onMove(k.id,to); }},
          h('option',{value:''},'Move to…'), cols.filter(x=>k.moves.includes(x.key)).map(x=>h('option',{value:x.key},x.label)));
        const el=h('div',{class:'bcard',draggable:'true','data-id':k.id,
          ondragstart:e=>{ dragging=k.id; e.dataTransfer.setData('text/plain',k.id); e.dataTransfer.effectAllowed='move'; el.classList.add('dragging'); },
          ondragend:()=>{ dragging=null; el.classList.remove('dragging'); }},
          k.body, h('div',{class:'bfoot'},k.chip,k.moves.length?sel:null));
        return el;
      }) : h('div',{class:'bempty'},'Nothing here. Drag a card in.'));
    col.addEventListener('dragover',e=>{ if(dragging && moves(dragging).includes(c.key)){ e.preventDefault(); col.classList.add('over'); } });
    col.addEventListener('dragleave',e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('over'); const id=dragging||e.dataTransfer.getData('text/plain'); dragging=null; if(id && moves(id).includes(c.key)) onMove(id,c.key); });
    return col;
  }));
}

// Edits a project's whole milestone list: quick splits of the quote, or rows typed by hand. Saving replaces the old list.
// With a quote, the last row holds the rest of it: it updates as the others are typed, and new rows go in above it.
function openMilestonesSheet(p){
  const quote=p.quoted||0, old=projMilestones(p);
  const box=h('div',{class:'msrows'}), total=h('div',{class:'total',role:'status'});
  let rows=[], rest=null;
  const amountOf = r => Number(r.amt.value)||0;
  const saved = () => rows.filter(r=>r!==rest || amountOf(r)>0); // a rest of ₹0 isn't saved
  const sync=()=>{
    if(rest){
      const left=cents(quote-rows.filter(r=>r!==rest).reduce((a,r)=>a+amountOf(r),0));
      rest.amt.value=left>0?left:0;
      rest.el.classList.toggle('none',left<=0);
      rest.note.textContent = left>0 ? 'The rest of the quote. It updates as you type the others.' : 'Nothing left: the milestones above cover the quote, so this one won’t be saved.';
    }
    const kept=saved();
    rows.forEach((r,i)=>{ r.name.placeholder=kept.includes(r)?msName(kept.indexOf(r),kept.length):''; r.name.setAttribute('aria-label','Milestone '+(i+1)+' name'); r.amt.setAttribute('aria-label','Milestone '+(i+1)+' amount (₹)'); r.due.setAttribute('aria-label','Milestone '+(i+1)+' due date'); });
    const keep=saved(), sum=cents(keep.reduce((a,r)=>a+amountOf(r),0)), off=quote && sum!==cents(quote);
    total.textContent = !keep.length ? 'No milestones. Saving removes them all.'
      : 'Total '+rs(sum)+(!quote?'':!off?' — matches the quote':sum>quote?' — '+rs(sum-quote)+' more than the '+rs(quote)+' quote':' — the quote is '+rs(quote));
    total.className='total'+(off&&keep.length?' warn':'');
  };
  const addRow=(m={},auto)=>{
    const r={ name:h('input',{value:m.name||''}),
      amt:h('input',{type:'number',inputmode:'decimal',min:'0',step:'any',placeholder:'Amount (₹)',value:m.amount||'',readonly:!!auto}),
      due:h('input',{type:'date',value:m.dueDate||''}) };
    r.amt.addEventListener('input',sync);
    r.note = auto ? h('div',{class:'hint auto-note'}) : null;
    r.el=h('div',{class:'msrow'+(auto?' rest':'')},r.name,r.amt,r.note,h('div',{class:'msfoot'},r.due,
      h('button',{class:'btn small ghost',type:'button',onclick:()=>{ rows=rows.filter(x=>x!==r); if(r===rest) rest=null; r.el.remove(); sync(); }},'Remove')));
    if(rest && !auto){ rows.splice(rows.indexOf(rest),0,r); box.insertBefore(r.el,rest.el); }
    else { rows.push(r); box.appendChild(r.el); }
    if(auto) rest=r;
    return r;
  };
  const reset=()=>{ const dues=rows.map(r=>r.due.value); rows=[]; rest=null; box.textContent=''; return dues; };
  // Whole rupees; the last part is the rest, so the total is exactly the quote (as in writes.js).
  const split=parts=>{ const dues=reset();
    parts.forEach((x,i)=>{ const last=i===parts.length-1; addRow({name:msName(i,parts.length),amount:last?'':Math.round(quote*x/100),dueDate:dues[i]},last); }); sync(); };
  const custom=()=>{ const dues=reset(); const first=addRow({name:'Advance',dueDate:dues[0]}); if(quote) addRow({name:'Final payment',dueDate:dues[1]},true); sync(); return first; };
  // Existing milestones keep their amounts; the last one only becomes the rest when they already add up to the quote.
  if(old.length){ const fits=quote && cents(old.reduce((a,m)=>a+m.amount,0))===cents(quote); old.forEach((m,i)=>addRow(m,fits&&i===old.length-1)); }
  else custom();
  sync();
  sheet('Payment milestones',[
    h('p',{class:'muted',style:'margin:0'},p.name+(quote?' · quoted '+rs(quote):' · no quoted price yet')),
    h('div',{class:'splits',role:'group','aria-label':'Quick splits'},
      [['50 / 50',[50,50]],['50 / 30 / 20',[50,30,20]]].map(([l,parts])=>h('button',{class:'btn small',type:'button',disabled:!quote,onclick:()=>split(parts)},l)),
      h('button',{class:'btn small',type:'button',onclick:()=>custom().amt.focus()},'Custom')),
    quote?null:h('div',{class:'hint'},'Set a quoted price on the project to use the quick splits and have the last milestone fill in the rest.'),
    box,
    h('button',{class:'linkbtn',type:'button',onclick:()=>{ const r=addRow(); sync(); r.amt.focus(); }},'+ Add milestone'),
    total
  ], async ()=>{
    const keep=saved(), list=[];
    for(let i=0;i<keep.length;i++){ const r=keep[i], amount=amountOf(r);
      if(!(amount>0)) return fail('Milestone '+(rows.indexOf(r)+1)+' needs an amount above ₹0.');
      list.push({project_id:p.id, name:r.name.value.trim()||msName(i,keep.length), amount, due_date:r.due.value||null, sort_order:i}); }
    await api.replaceMilestones(old.map(m=>m.id), list);
  }, 'Save milestones', {noFocus:true});
}

// ---------- invoices ----------
const biz = () => S.settings[0] || map.settings({});
const invOf = id => S.invoices.find(i=>i.id===id);
// PREFIX/2026-27/001: counts up within each financial year and is never reused (same as ledger.js).
const fyOfDate = d => { const y=Number(d.slice(0,4)), st=Number(d.slice(5,7))>=4?y:y-1; return st+'-'+String(st+1).slice(2); };
function nextInvoiceNumber(prefix, issue){
  const head=prefix+'/'+fyOfDate(issue)+'/';
  const used=S.invoices.map(i=>i.number).filter(n=>n.startsWith(head)).map(n=>Number(n.slice(head.length))).filter(Number.isFinite);
  return head+String(Math.max(0,...used)+1).padStart(3,'0');
}
const addDays = (d,n) => { const x=parseD(d); x.setDate(x.getDate()+n); return ymd(x); };
const daysSince = d => Math.round((parseD(today())-parseD(d))/864e5);
// Paid when its linked payments reach the total; cancelled is never owed; a draft isn't sent yet. Same rules as ledger.js.
function invState(inv){
  const paid=cents(S.txns.filter(t=>t.invoiceId===inv.id && t.type!=='out').reduce((a,t)=>a+t.amount,0)), due=cents(Math.max(0,inv.total-paid));
  const state = inv.status==='cancelled'?'cancelled' : !due||inv.status==='paid'?'paid' : inv.status==='draft'?'draft' : inv.dueDate&&inv.dueDate<today()?'overdue' : paid?'part-paid':'unpaid';
  return {paid, due:['paid','cancelled'].includes(state)?0:due, state, days:state==='overdue'?daysSince(inv.dueDate):0};
}
const INV_STATES = {draft:'Draft',unpaid:'Unpaid','part-paid':'Part paid',overdue:'Overdue',paid:'Paid',cancelled:'Cancelled'};
const owing = x => x.due>0 && x.state!=='draft'; // sent and not fully paid
function upiLink(inv,due){
  const b=biz(); if(!b.upiId || !due) return null;
  const q={pa:b.upiId, pn:b.businessName||b.upiId, am:due.toFixed(2), cu:'INR', tn:inv.number};
  return 'upi://pay?'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
}
// Drawn with the qrcode-generator library from the CDN. Without it, the UPI ID and link still show.
function qrSvg(text){
  if(!window.qrcode) return null;
  const q=window.qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(), m=4, d=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d.push('M'+(c+m)+','+(r+m)+'h1v1h-1z');
  return svg('svg',{viewBox:'0 0 '+(n+2*m)+' '+(n+2*m),width:'150',height:'150',role:'img','aria-label':'UPI QR code','shape-rendering':'crispEdges','data-upi':text},
    svg('rect',{width:'100%',height:'100%',fill:'#fff'}),svg('path',{d:d.join(''),fill:'#000'}));
}
// Indian numbers: 10 digits means +91 (same as ledger.js).
function waNumber(contact){ const m=String(contact||'').match(/\+?\d[\d\s-]{8,}\d/); if(!m) return null; const d=m[0].replace(/\D/g,''); return d.length===10?'91'+d:d.length>=11&&d.length<=15?d:null; }
// Reminders get firmer after 7 and 30 days overdue.
function reminderText(inv){
  const s=invState(inv), c=clientOf(inv.clientId)||{}, b=biz(), amt=rs(s.due), due=inv.dueDate?fmtDate(inv.dueDate):'';
  const body = s.days>30 ? 'Invoice '+inv.number+' for '+amt+' is now '+s.days+' days overdue. Please make the payment by '+fmtDate(addDays(today(),7))+', or reply with the date you will pay it.'
    : s.days>=7 ? 'Invoice '+inv.number+' for '+amt+' was due on '+due+' and is now '+s.days+' days overdue. Please arrange the payment this week.'
    : 'This is a friendly reminder that invoice '+inv.number+' for '+amt+(s.state==='overdue'?' was due on '+due:due?' is due on '+due:' is due')+'.';
  const pay=[b.upiId?'You can pay by UPI to '+b.upiId+'.':'', b.bankDetails?'Bank transfer:\n'+b.bankDetails:''].filter(Boolean).join('\n');
  return ['Hi'+(c.name?' '+c.name:'')+',', body, pay, 'Thank you'+(b.businessName?',\n'+b.businessName:'')].filter(Boolean).join('\n\n');
}

// What each client owes on sent invoices, most overdue first. Used on the dashboard and the Invoices tab.

  S.invoices.map(i=>({i,...invState(i)})).filter(owing).forEach(x=>{ const o=by[x.i.clientId]=by[x.i.clientId]||{id:x.i.clientId,due:0,days:0,n:0}; o.due+=x.due; o.days=Math.max(o.days,x.days); o.n++; });
  const list=Object.values(by).sort((a,b)=>b.days-a.days||b.due-a.due);

  return h('div',{class:'card'},h('div',{class:'card-head'},h('h2',null,'To collect on invoices'),h('span',{class:'num sub'},rs(list.reduce((a,o)=>a+o.due,0)))),
    h('div',{class:'list'},list.map(o=>h('a',{class:'row',href:hrefOf({name:'client',id:o.id})},
      h('div',{class:'grow'},h('div',{class:'title'},clientName(o.id)),h('div',{class:'sub'},o.n+(o.n===1?' invoice':' invoices')+(o.days?' · '+o.days+(o.days===1?' day':' days')+' overdue':' · not due yet'))),
      h('span',{class:'num'+(o.days?' out':'')},rs(o.due))))));
}

// Paid comes from payments, so taking a paid invoice back to Draft or Sent means removing the payments recorded for it.
// Asks first, lists them, and does nothing until confirmed.
function reopenInvoice(inv,to){
  const pays=S.txns.filter(t=>t.invoiceId===inv.id && t.type!=='out'), total=pays.reduce((a,t)=>a+t.amount,0);
  const patch=to==='sent'?{status:'sent',sent_at:inv.sentAt||new Date().toISOString()}:{status:to};
  const set=async()=>{ await api.update('invoices',inv.id,patch); };
  if(!pays.length) return quietly(set);
  confirmSheet('Move '+inv.number+' back to '+(to==='sent'?'Sent':'Draft')+'?',
    'Its payments ('+pays.map(t=>rs(t.amount)+' on '+fmtDate(t.date)).join(', ')+', '+rs(total)+' in all) will be deleted so it is owed again. To keep them, cancel and edit or delete a payment yourself.',
    'Delete payments and move back', async()=>{
      const { error } = await db.from('txns').delete().in('id',pays.map(t=>t.id)); if(error) throw error;
      await set();
    });
}
// Draft → Sent → Paid, or Cancelled. Overdue and part paid stay in Sent with their label. Paid comes from payments,
// so moving a card to Paid opens Record payment; moving a paid card back to Draft or Sent deletes its payments (after asking).
function invoiceBoard(all){
  const col = x => x.state==='cancelled'?'cancelled' : x.state==='paid'?'paid' : x.state==='draft'?'draft' : 'sent';
  const cols=[['draft','Draft'],['sent','Sent'],['paid','Paid'],['cancelled','Cancelled']];
  const sorted=all.slice().sort((a,b)=>b.days-a.days||b.i.issueDate.localeCompare(a.i.issueDate)||b.i.number.localeCompare(a.i.number));
  return board(cols.map(([k,l])=>{
    const xs=sorted.filter(x=>col(x)===k);
    return { key:k, label:l, sub:rs(xs.reduce((a,x)=>a+(k==='sent'?x.due:k==='cancelled'?0:x.i.total),0)), cards:xs.map(x=>({ id:x.i.id, name:x.i.number,

}

// ---------- renewals ----------
// A cycle moves the date by whole months, landing on the last day of shorter months (same as ledger.js).
const CYCLES = [['monthly','Monthly',1],['quarterly','Every 3 months',3],['yearly','Yearly',12]];
const cycleMonths = c => (CYCLES.find(x=>x[0]===c)||CYCLES[2])[2];
const KINDS = [['domain','Domain','Domain'],['hosting','Hosting','Hosting'],['ssl','SSL','Software & plugins'],['maintenance','Maintenance','Other'],['email','Email','Software & plugins'],['other','Other','Other']];
const kindOf = k => KINDS.find(x=>x[0]===k)||KINDS[5];
function addMonths(d,n){ const y=Number(d.slice(0,4)), m=Number(d.slice(5,7))-1+n, day=Number(d.slice(8,10)); const last=new Date(y,m+1,0).getDate(); return ymd(new Date(y,m,Math.min(day,last))); }
const sortServices = arr => arr.slice().sort((a,b)=>(b.active-a.active)||a.nextRenewal.localeCompare(b.nextRenewal));
const yearly = x => 12/cycleMonths(x.cycle);
function serviceWhen(x){
  if(!x.active) return 'Stopped';
  const d=-daysSince(x.nextRenewal);
  return d<0 ? 'Was due '+fmtDate(x.nextRenewal)+' · '+(-d)+(d===-1?' day':' days')+' overdue' : d===0 ? 'Renews today' : 'Renews '+fmtDate(x.nextRenewal)+' · in '+d+(d===1?' day':' days');
}
function serviceRow(x, showClient){
  const overdue=x.active && x.nextRenewal<today();
  return h('div',{class:'svcrow'},
    h(canWrite()?'button':'div',{class:'grow',type:canWrite()?'button':null,'aria-label':canWrite()?'Edit '+x.name:null,onclick:canWrite()?()=>openServiceSheet({service:x}):null},
      h('div',{class:'title'},x.name),
      h('div',{class:'sub'},[showClient?clientName(x.clientId):null, kindOf(x.kind)[1], rs(x.price)+' '+(CYCLES.find(c=>c[0]===x.cycle)||CYCLES[2])[1].toLowerCase()].filter(Boolean).join(' · ')),
      h('div',{class:'sub'+(overdue?' out':'')},serviceWhen(x))),
    canWrite()&&x.active?h('button',{class:'btn small'+(overdue?' primary':''),type:'button',onclick:()=>openRenewSheet(x)},'Renew'):null);
}

    h('div',{class:'two'},field('v-cycle','Renews',cycle),field('v-next','Next renewal',next)),
    h('label',{class:'check'},auto,'Renews automatically with the provider'),
    editing?h('label',{class:'check'},active,'Still active (untick to stop tracking it)'):null,
    field('v-notes','Notes',notes)
  ], async ()=>{
    const n=name.value.trim(); if(!n) return fail('Give the service a name.');
    if(!next.value) return fail('Pick the next renewal date.');
    const c=cost.value===''?0:Number(cost.value), pr=price.value===''?0:Number(price.value);
    if(!(c>=0) || !(pr>=0)) return fail('Amounts can’t be negative.');
    const cid=await client.resolve(); if(!cid) return false;
    const row={client_id:cid, project_id:pSel.value||null, kind:kind.value, name:n, provider:provider.value.trim(), cost:c, price:pr, cycle:cycle.value, next_renewal:next.value, auto_renew:auto.checked, active:editing?active.checked:true, notes:notes.value.trim()};
    if(editing) await api.update('services',x.id,row); else await api.insert('services',row);
  }, editing?'Save changes':'Add service', editing?{onDelete:()=>confirmSheet('Delete '+x.name+'?','Its past expenses and invoices stay. To keep it on record instead, untick Still active.','Delete service',async()=>{ await api.del('services',x.id); }), deleteLabel:'Delete service'}:{});
}

// Shows what Renew will do, with each step optional, then does it: invoice the client, log the cost, move the date.
function openRenewSheet(x){
  const b=biz(), t=today(), next=addMonths(x.nextRenewal,cycleMonths(x.cycle)), number=nextInvoiceNumber(b.invoicePrefix,t), client=clientName(x.clientId);
  const period=fmtDate(x.nextRenewal)+' to '+fmtDate(addDays(next,-1));
  const doExp=h('input',{type:'checkbox',id:'rn-exp'}); doExp.checked=x.cost>0;
  const doInv=h('input',{type:'checkbox',id:'rn-inv'}); doInv.checked=x.price>0;
  const step=(box,txt,ok)=>h('li',null,h('label',null,box,h('span',null,txt)));
  if(!(x.cost>0)) doExp.disabled=true;
  if(!(x.price>0)) doInv.disabled=true;
  sheet('Renew '+x.name,[
    h('p',{class:'muted',style:'margin:0'},client+' · '+kindOf(x.kind)[1]+' · '+period),
    h('ul',{class:'renew-steps'},
      step(doExp, x.cost>0 ? 'Log '+rs(x.cost)+' spent on '+x.name+' ('+kindOf(x.kind)[2]+')' : 'No cost to log'),
      step(doInv, x.price>0 ? 'Create draft invoice '+number+' to '+client+' for '+rs(x.price) : 'No price to invoice'),
      h('li',null,h('label',null,h('input',{type:'checkbox',checked:true,disabled:true}),h('span',null,'Move the next renewal from '+fmtDate(x.nextRenewal)+' to '+fmtDate(next))))),
  ], async ()=>{
    let invId=null;
    if(doInv.checked) invId=await api.insert('invoices',{client_id:x.clientId, project_id:x.projectId, milestone_id:null, number, issue_date:t, due_date:addDays(t,b.paymentTermsDays),
      items:[{description:x.name+' — '+x.kind+' renewal ('+period+')', quantity:1, rate:x.price}], total:x.price, status:'draft', notes:b.invoiceNotes});
    if(doExp.checked) await api.insert('txns',{client_id:x.clientId, project_id:x.projectId, type:'out', amount:x.cost, category:kindOf(x.kind)[2], note:x.name+' renewal', date:t});
    await api.update('services',x.id,{next_renewal:next});
    if(invId) go({name:'invoice',id:invId});
  }, 'Renew', {noFocus:true});
}

// ---------- login ----------
function renderLogin(v){
  const email=h('input',{id:'l-email',type:'email',autocomplete:'email',required:true,placeholder:'you@example.com'});
  const pass=h('input',{id:'l-pass',type:'password',autocomplete:'current-password',required:true});
  const err=h('div',{class:'err',role:'alert'});
  const btn=h('button',{class:'btn primary',type:'submit',style:'justify-content:center'},'Sign in');
  const reset=h('button',{class:'linkbtn',type:'button'},'Forgot password?');
  const form=h('form',{class:'login'},
    h('h1',null,'Client Ledger'),
    h('div',{class:'muted'},'Private. Sign in to see your projects and money.'),
    h('div',{class:'field'},h('label',{for:'l-email'},'Email'),email),
    h('div',{class:'field'},h('label',{for:'l-pass'},'Password'),pass),
    err, btn, reset);
  form.addEventListener('submit',async e=>{
    e.preventDefault(); err.textContent=''; btn.disabled=true;
    const { error } = await sb.auth.signInWithPassword({ email:email.value.trim(), password:pass.value });
    btn.disabled=false;
    if(error) err.textContent = /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message;
  });
  reset.addEventListener('click',async ()=>{
    err.textContent='';
    if(!email.value.trim()){ err.textContent='Type your email first, then tap Forgot password.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.origin + location.pathname });
    err.textContent = error ? error.message : 'If that email has an account, a reset link is on its way.';
  });
  v.appendChild(form); email.focus();
}

// ---------- data (Supabase) ----------
const cfg = window.LEDGER_CONFIG || {};
const sb = (window.supabase && cfg.supabaseUrl && cfg.supabaseAnonKey) ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey) : null;
const ms = t => t ? Date.parse(t) : 0;
const TABLES = ['clients','projects','txns','milestones','invoices','settings','services'];
const OPTIONAL = ['milestones','invoices','settings','services']; // added later: an empty list until supabase/schema.sql is re-run, so the app still loads
// Columns added for the dashboard default to empty, so the app still loads before supabase/schema.sql is re-run.
const map = {
  clients: r => ({ id:r.id, name:r.name, contact:r.contact||'', notes:r.notes||'', order:r.sort_order, createdAt:ms(r.created_at) }),
  projects: r => ({ id:r.id, clientId:r.client_id, name:r.name, status:r.status||'active', description:r.description||'', quoted:Number(r.quoted)||0,
    previewUrl:cleanUrl(r.preview_url)||'', liveUrl:cleanUrl(r.live_url)||'', githubUrl:cleanUrl(r.github_url)||'', startDate:r.start_date||null, dueDate:r.due_date||null, createdAt:ms(r.created_at) }),
  txns: r => ({ id:r.id, clientId:r.client_id, projectId:r.project_id, type:r.type, amount:Number(r.amount), category:r.category||(r.type==='out'?guessCategory(r.note):''), note:r.note||'', date:r.date, invoiceId:r.invoice_id||null, createdAt:ms(r.created_at) }),
  milestones: r => ({ id:r.id, projectId:r.project_id, name:r.name||'', amount:Number(r.amount)||0, dueDate:r.due_date||null, order:r.sort_order??0, createdAt:ms(r.created_at) }),
  invoices: r => ({ id:r.id, clientId:r.client_id, projectId:r.project_id||null, milestoneId:r.milestone_id||null, number:r.number, issueDate:r.issue_date, dueDate:r.due_date||null,
    total:Number(r.total)||0, status:r.status||'draft', notes:r.notes||'', sentAt:r.sent_at||null, lastReminded:r.last_reminded||null, reminderCount:r.reminder_count||0, createdAt:ms(r.created_at),
    items:(Array.isArray(r.items)?r.items:[]).map(i=>({description:i.description||'', quantity:Number(i.quantity)||0, rate:Number(i.rate)||0})) }),
  settings: r => ({ id:r.id, businessName:r.business_name||'', address:r.address||'', phone:r.phone||'', email:r.email||'', upiId:r.upi_id||'', bankDetails:r.bank_details||'',
    invoicePrefix:r.invoice_prefix||'INV', paymentTermsDays:r.payment_terms_days??7, invoiceNotes:r.invoice_notes||'' }),
  services: r => ({ id:r.id, clientId:r.client_id, projectId:r.project_id||null, kind:r.kind||'other', name:r.name||'', provider:r.provider||'', cost:Number(r.cost)||0, price:Number(r.price)||0,
    cycle:r.cycle||'yearly', nextRenewal:r.next_renewal, autoRenew:!!r.auto_renew, active:r.active!==false, notes:r.notes||'', createdAt:ms(r.created_at) })
};
async function load(){
  const res = await Promise.all(TABLES.map(t=>sb.from(t).select('*')));
  const bad = res.find((r,i)=>r.error && !OPTIONAL.includes(TABLES[i]));
  if(bad){ S.error='Couldn’t load your ledger: '+bad.error.message; render(); return; }
  TABLES.forEach((t,i)=>{ S[t]=(res[i].error?[]:res[i].data).map(map[t]); });
  S.ready=true; S.error=''; render();
}
const api = {
  async insert(table,row){ const { data, error } = await sb.from(table).insert(row).select('id').single(); if(error) throw error; await load(); return data.id; },
  async update(table,id,row){ const { error } = await sb.from(table).update(row).eq('id',id); if(error) throw error; await load(); },
  async del(table,id){ const { error } = await sb.from(table).delete().eq('id',id); if(error) throw error; await load(); },
  // The new list goes in before the old rows come out, so a failed save never loses the old milestones.
  async replaceMilestones(oldIds,rows){
    if(rows.length){ const { error } = await sb.from('milestones').insert(rows); if(error) throw error; }
    for(const id of oldIds){ const { error } = await sb.from('milestones').delete().eq('id',id); if(error) throw error; }
    await load();
  }
};
function openNewPasswordSheet(){
  const p=h('input',{id:'np',type:'password',autocomplete:'new-password',minlength:'8',required:true});
  sheet('Set a new password',[field('np','New password (8+ characters)',p)], async ()=>{
    if(p.value.length<8) return fail('Use at least 8 characters.');
    const { error } = await sb.auth.updateUser({ password:p.value });
    if(error) return fail(error.message);
  }, 'Save password');
}
db = sb;
S.view = parseHash();
$('#signout').addEventListener('click',()=>sb && sb.auth.signOut());
render();
if(!sb){
  S.authReady=true; S.session={}; S.error='The app isn’t set up yet. Add your Supabase project URL and anon key to config.js.'; render();
} else {
  sb.auth.onAuthStateChange((event, session)=>{
    S.authReady=true; S.session=session;
    if(event==='PASSWORD_RECOVERY') setTimeout(openNewPasswordSheet,0);
    if(session){ if(event!=='TOKEN_REFRESHED') setTimeout(load,0); }
    else { S.clients=[]; S.projects=[]; S.txns=[]; S.milestones=[]; S.invoices=[]; S.settings=[]; S.services=[]; S.ready=false; closeSheet(); render(); }
  });
}
})();
</script>
